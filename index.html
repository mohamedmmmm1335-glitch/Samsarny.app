<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمسرني – عقارات بلدنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --dark: #0f0f0f; --dark2: #1a1a1a;
    --dark3: #242424; --card: #1e1e1e; --text: #f0ece0; --text-muted: #9a9080;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.07) 0%, transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(201,168,76,0.05) 0%, transparent 50%); pointer-events: none; z-index: 0; }
  
  header { position: sticky; top: 0; z-index: 100; background: rgba(15,15,15,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--gold); cursor: pointer; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #0f0f0f; }
  .logo span { color: var(--text); font-weight: 400; font-size: 0.9rem; display: block; line-height: 1; }

  .hero { position: relative; padding: 40px 24px; text-align: center; z-index: 1; }
  .hero h1 { font-family: 'Tajawal', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; margin-bottom: 12px; }
  .hero h1 .highlight { background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  
  .search-bar { display: flex; gap: 10px; max-width: 640px; margin: 0 auto 16px; background: var(--dark2); border: 1.5px solid rgba(201,168,76,0.25); border-radius: 14px; padding: 12px 16px; align-items: center; }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Cairo'; font-size: 1rem; }
  
  .filter-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .pill { padding: 7px 16px; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.2); background: transparent; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
  .pill.active { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--gold); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 0 24px 60px; position: relative; z-index: 1; }
  .card { position: relative; background: var(--card); border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.06); overflow: hidden; transition: 0.25s; }
  .card-img { width: 100%; height: 200px; object-fit: cover; background: #2a2a2a; border-bottom: 1px solid rgba(201,168,76,0.1); }
  .card-body { padding: 18px; }
  .price { font-family: 'Tajawal'; font-weight: 800; font-size: 1.3rem; color: var(--gold); margin-bottom: 5px; }
  .call-btn { padding: 12px; border-radius: 10px; background: var(--gold); color: #0f0f0f; text-decoration: none; font-weight: 700; display: block; text-align: center; margin-top: 15px; }

  /* زر الحذف */
  .delete-btn { position: absolute; left: 10px; top: 10px; background: rgba(220, 53, 69, 0.9); color: white; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; z-index: 10; font-family: 'Cairo'; font-weight: 600; font-size: 0.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

  .fab { position: fixed; bottom: 30px; left: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--gold); border: none; font-size: 35px; display: none; align-items: center; justify-content: center; padding-bottom: 7px; cursor: pointer; z-index: 500; box-shadow: 0 8px 30px rgba(201,168,76,0.4); }
  
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--dark2); border-radius: 20px; width: 100%; max-width: 450px; padding: 25px; border: 1px solid var(--gold); margin-top: auto; margin-bottom: auto; }
  .form-control { width: 100%; background: var(--dark3); border: 1px solid #333; border-radius: 10px; padding: 12px; color: white; margin-bottom: 12px; font-family: 'Cairo'; }
  .img-upload-box { background: var(--dark3); border: 2px dashed #444; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; position: relative; }
  #previewImg { width: 100%; max-height: 150px; object-fit: contain; border-radius: 8px; display: none; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="adminAccess()">
    <div class="logo-icon">🏠</div>
    <div>سمسرني <span>عقارات بلدنا</span></div>
  </div>
</header>

<section class="hero">
  <h1>اوعى تدور على عقار<br> من غير <span class="highlight">سمسرني</span></h1>
  <div class="search-bar">
    <input type="text" placeholder="ابحث بالعنوان أو المنطقة..." id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('type', 'all', this)">الكل</button>
    <button class="pill" onclick="setFilter('purpose', 'إيجار', this)">للإيجار</button>
    <button class="pill" onclick="setFilter('purpose', 'بيع', this)">للبيع</button>
    <button class="pill" onclick="setFilter('type', 'شقة', this)">شقق</button>
    <button class="pill" onclick="setFilter('type', 'محل', this)">محلات</button>
    <button class="pill" onclick="setFilter('type', 'أرض', this)">أراضي</button>
  </div>
</section>

<div class="grid" id="grid"></div>

<button class="fab" id="adminBtn" onclick="openModal()">+</button>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 style="margin-bottom:20px; color:var(--gold)">إضافة عقار جديد</h2>
    <div class="img-upload-box" onclick="document.getElementById('fileInput').click()">
      <p id="uploadStatus">📸 اضغط هنا لتصوير العقار</p>
      <input type="file" id="fileInput" hidden accept="image/*" onchange="handleImage(this)">
      <img id="previewImg">
    </div>
    <input type="text" id="f_title" class="form-control" placeholder="عنوان الإعلان">
    <div style="display:flex; gap:10px;">
      <select id="f_purpose" class="form-control"><option value="بيع">بيع</option><option value="إيجار">إيجار</option></select>
      <select id="f_type" class="form-control"><option value="شقة">شقة</option><option value="محل">محل</option><option value="أرض">أرض</option></select>
    </div>
    <input type="number" id="f_price" class="form-control" placeholder="السعر">
    <input type="text" id="f_area" class="form-control" placeholder="المنطقة">
    <input type="tel" id="f_phone" class="form-control" placeholder="رقم التواصل">
    <button class="call-btn" style="width: 100%; border: none; cursor:pointer;" onclick="saveToFirebase()">نشر الإعلان</button>
    <button onclick="closeModal()" style="background:none; border:none; color:grey; width:100%; margin-top:15px; cursor:pointer;">إلغاء</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allData = {};
  let currentFilters = { type: 'all', purpose: 'all' };
  let base64Image = "";

  function adminAccess() {
    if(prompt("كلمة السر للإدارة:") === "155361") {
      document.getElementById('adminBtn').style.display = 'flex';
      applyFilters(); // لتحديث العرض وإظهار أزرار الحذف فوراً
      alert("مرحباً بك يا محمد في لوحة التحكم ✅");
    }
  }

  function handleImage(input) {
    const file = input.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        base64Image = e.target.result;
        document.getElementById('previewImg').src = base64Image;
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('uploadStatus').innerText = "تم التقاط الصورة ✅";
      };
      reader.readAsDataURL(file);
    }
  }

  function openModal() { document.getElementById('addModal').classList.add('open'); }
  function closeModal() { document.getElementById('addModal').classList.remove('open'); }

  function saveToFirebase() {
    const data = {
      title: document.getElementById('f_title').value,
      purpose: document.getElementById('f_purpose').value,
      type: document.getElementById('f_type').value,
      price: document.getElementById('f_price').value,
      area: document.getElementById('f_area').value,
      phone: document.getElementById('f_phone').value,
      img: base64Image
    };
    if(!data.title || !data.price) return alert("برجاء ملء البيانات الأساسية");
    db.ref('properties').push(data).then(() => { closeModal(); });
  }

  function deleteProperty(id) {
    if(confirm("هل أنت متأكد من حذف هذا العقار؟")) {
      db.ref('properties/' + id).remove();
    }
  }

  db.ref('properties').on('value', (snap) => {
    allData = snap.val() || {};
    applyFilters();
  });

  function setFilter(key, val, btn) {
    if(key === 'type' && val === 'all') { currentFilters.type = 'all'; currentFilters.purpose = 'all'; }
    else currentFilters[key] = val;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('grid');
    grid.innerHTML = "";
    const isAdmin = document.getElementById('adminBtn').style.display === 'flex';

    for (let id in allData) {
      const item = allData[id];
      const matchSearch = item.title.toLowerCase().includes(search) || item.area.toLowerCase().includes(search);
      const matchType = currentFilters.type === 'all' || item.type === currentFilters.type;
      const matchPurpose = currentFilters.purpose === 'all' || item.purpose === currentFilters.purpose;

      if(matchSearch && matchType && matchPurpose) {
        grid.innerHTML += `
          <div class="card">
            ${isAdmin ? `<button class="delete-btn" onclick="deleteProperty('${id}')">حذف 🗑️</button>` : ''}
            ${item.img ? `<img src="${item.img}" class="card-img">` : `<div class="card-img" style="display:flex;align-items:center;justify-content:center">🏠 لا توجد صورة</div>`}
            <div class="card-body">
              <div class="price">${Number(item.price).toLocaleString()} ج.م</div>
              <h3 style="font-size:1.1rem; margin-bottom:8px;">${item.title}</h3>
              <p style="color:var(--text-muted); font-size:0.85rem;">📍 ${item.area} | لل${item.purpose} (${item.type})</p>
              <a href="tel:${item.phone}" class="call-btn">📞 اتصل الآن</a>
            </div>
          </div>`;
      }
    }
  }
</script>
</body>
</html>
