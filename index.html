<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سمسرني V36 - النسخة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c9a84c; 
            --dark-bg: #0f0f0f; 
            --card-bg: #1a1a1a;
            --text: #f0ece0;
            --muted: #9a9080;
            --whatsapp: #25D366;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark-bg); color: var(--text); direction: rtl; min-height: 100vh; }

        /* Header */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--dark-bg); z-index: 100; border-bottom: 1px solid #222; }
        .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-img { width: 45px; height: 45px; background: var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; }
        .logo-text h2 { color: var(--gold); font-size: 1.2rem; line-height: 1; margin: 0; }
        .logo-text span { font-size: 0.7rem; color: var(--muted); }

        /* Stats Section */
        .stats-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; text-align: center; }
        .stat-item { display: flex; flex-direction: column; min-width: 60px; }
        .stat-num { font-size: 1.6rem; font-weight: 900; color: var(--gold); line-height: 1.2; }
        .stat-label { font-size: 0.75rem; color: var(--muted); }

        /* Search & Filters */
        .search-section { padding: 0 20px; }
        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto 15px; }
        .search-wrapper input { 
            width: 100%; padding: 12px 45px 12px 15px; background: var(--card-bg); 
            border: 1px solid #333; border-radius: 15px; color: #fff; font-family: 'Cairo'; outline: none;
        }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }

        .pills-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .pill { 
            padding: 6px 18px; border-radius: 50px; background: transparent; 
            border: 1px solid #333; color: var(--text); cursor: pointer; transition: 0.3s; font-size: 0.9rem;
        }
        .pill.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }
        .pill.worker-pill { border-radius: 12px; border: 1.5px solid var(--gold); }

        /* Sorting Header */
        .list-header { padding: 0 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .sort-select { background: var(--card-bg); color: #fff; border: 1px solid #333; padding: 5px 10px; border-radius: 8px; font-family: 'Cairo'; outline: none; font-size: 0.85rem; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; padding-bottom: 100px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #222; position: relative; }
        .image-container { position: relative; width: 100%; height: 200px; background: #000; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; z-index: 10; }
        .badge-avail { background: var(--gold); color: #000; }
        .badge-sold { background: #ff4757; color: #fff; }

        .card-info { padding: 15px; }
        .price { font-size: 1.4rem; font-weight: 900; color: var(--gold); }
        .title { font-size: 1.05rem; margin: 5px 0; font-weight: 600; }
        .area { color: var(--muted); font-size: 0.85rem; margin-bottom: 15px; }
        
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 10px; border-radius: 10px; text-decoration: none; text-align: center; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-call { background: var(--gold); color: #000; }
        .btn-wa { background: var(--whatsapp); color: #fff; }

        .fab { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; border-radius: 20px; background: var(--gold); color: #000; display: none; align-items: center; justify-content: center; font-size: 30px; border: none; cursor: pointer; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .ad-banner { grid-column: 1 / -1; background: #1a1a1a; border: 1.5px dashed var(--gold); padding: 20px; border-radius: 15px; text-align: center; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo-area" onclick="initAdmin()">
        <div class="logo-img">🏠</div>
        <div class="logo-text">
            <h2>سمسرني</h2>
            <span>عقاراتك وصنايعيتك</span>
        </div>
    </div>
    <div class="theme-toggle" onclick="document.body.classList.toggle('light-mode')">🌓</div>
</header>

<p style="text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 10px;">أفضل العقارات والخدمات في بلدنا</p>

<div class="stats-container">
    <div class="stat-item"><span class="stat-num" id="totalAds">0</span><span class="stat-label">إعلان</span></div>
    <div class="stat-item"><span class="stat-num" id="totalRent">0</span><span class="stat-label">للإيجار</span></div>
    <div class="stat-item"><span class="stat-num" id="totalSale">0</span><span class="stat-label">للبيع</span></div>
    <div class="stat-item"><span class="stat-num" id="totalWorkers">0</span><span class="stat-label">صنايعي</span></div>
</div>

<div class="search-section">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchBox" placeholder="ابحث عن منطقة، شقة، نجار..." oninput="renderAll()">
    </div>

    <div class="pills-grid">
        <button class="pill active" onclick="setF('all', 'all', this)">الكل</button>
        <button class="pill" onclick="setF('purpose', 'إيجار', this)">للإيجار</button>
        <button class="pill" onclick="setF('purpose', 'بيع', this)">للبيع</button>
        <button class="pill" id="availPill" onclick="toggleAvailable(this)">متاح فقط</button>
        <button class="pill" onclick="setF('mode', 'request', this)">مطلوب</button>
        <button class="pill worker-pill" onclick="setF('mode', 'worker', this)">👷 صنايعية</button>
    </div>
</div>

<div class="list-header">
    <h3 style="font-size: 1rem;">الإعلانات</h3>
    <select class="sort-select" onchange="setSort(this.value)">
        <option value="new">الأحدث أولاً</option>
        <option value="old">الأقدم أولاً</option>
        <option value="price-high">الأعلى سعراً</option>
        <option value="price-low">الأقل سعراً</option>
    </select>
</div>

<div class="grid" id="mainGrid"></div>

<button class="fab" id="addBtn" onclick="alert('افتح قائمة الإضافة')">+</button>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAUt5G3o2CRa_hW3TF6aoRDqlj00h_duiY",
        databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com",
        projectId: "samsarny-5a5c2",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let store = {}, filterObj = {purpose:'all', mode:'all', onlyAvailable: false}, sortBy = 'new';

    function initAdmin() {
        const p = prompt("كلمة السر:");
        db.ref('admin_pass').once('value').then(s => {
            if(p === String(s.val())) { localStorage.setItem('samsar_admin', 'true'); location.reload(); }
        });
    }

    if(localStorage.getItem('samsar_admin') === 'true') document.getElementById('addBtn').style.display = 'flex';

    function updateStats(data) {
        let ads = Object.values(data);
        document.getElementById('totalAds').innerText = ads.length;
        document.getElementById('totalRent').innerText = ads.filter(a => a.purpose === 'إيجار').length;
        document.getElementById('totalSale').innerText = ads.filter(a => a.purpose === 'بيع').length;
        document.getElementById('totalWorkers').innerText = ads.filter(a => a.mode === 'worker').length;
    }

    function setF(k, v, btn) {
        if(v === 'all') { filterObj.purpose = 'all'; filterObj.mode = 'all'; }
        else filterObj[k] = v;
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        if(filterObj.onlyAvailable) document.getElementById('availPill').classList.add('active');
        btn.classList.add('active'); renderAll();
    }

    function toggleAvailable(btn) {
        filterObj.onlyAvailable = !filterObj.onlyAvailable;
        btn.classList.toggle('active'); renderAll();
    }

    function setSort(val) { sortBy = val; renderAll(); }

    db.ref('properties').on('value', snap => {
        store = snap.val() || {};
        updateStats(store);
        renderAll();
    });

    function renderAll() {
        const grid = document.getElementById('mainGrid');
        const q = document.getElementById('searchBox').value.toLowerCase();
        grid.innerHTML = "";
        
        let items = Object.keys(store).map(id => ({id, ...store[id]}));

        // Filter
        items = items.filter(itm => {
            const mMode = filterObj.mode === 'all' || itm.mode === filterObj.mode;
            const mPurp = filterObj.purpose === 'all' || itm.purpose === filterObj.purpose;
            const mAvail = !filterObj.onlyAvailable || (itm.status === 'available' || !itm.status);
            const mSearch = (itm.title||'').toLowerCase().includes(q) || (itm.area||'').toLowerCase().includes(q);
            return mMode && mPurp && mAvail && mSearch;
        });

        // Sort
        if(sortBy === 'new') items.sort((a,b) => b.time - a.time);
        if(sortBy === 'old') items.sort((a,b) => a.time - b.time);
        if(sortBy === 'price-high') items.sort((a,b) => b.price - a.price);
        if(sortBy === 'price-low') items.sort((a,b) => a.price - b.price);

        items.forEach((itm, index) => {
            const isSold = itm.status === 'sold' || itm.status === 'reserved';
            const img = itm.media && itm.media[0] ? itm.media[0].src : 'https://via.placeholder.com/400x300?text=No+Image';
            
            grid.innerHTML += `
            <div class="card">
                <div class="image-container">
                    <img src="${img}" class="card-img">
                    <div class="badge ${isSold ? 'badge-sold' : 'badge-avail'}">
                        ${itm.verified ? '✅ ' : ''}${isSold ? 'تم التنفيذ' : (itm.purpose || 'متاح')}
                    </div>
                </div>
                <div class="card-info">
                    <div class="price">${Number(itm.price).toLocaleString()} ج.م</div>
                    <h3 class="title">${itm.title}</h3>
                    <p class="area">📍 ${itm.area}</p>
                    <div class="actions">
                        <a href="tel:${itm.phone}" class="btn btn-call">📞 اتصال</a>
                        <a href="https://wa.me/20${itm.phone}" class="btn btn-wa">واتساب</a>
                    </div>
                </div>
            </div>`;

            if((index + 1) % 4 === 0) {
                grid.innerHTML += `<div class="ad-banner">سمسرني.. بيتك الجديد في ضغطة زر! 🏠</div>`;
            }
        });
    }
</script>
</body>
    </html>
