<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمسرني – عقارات بلدنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --dark: #0f0f0f; --dark2: #1a1a1a;
    --dark3: #242424; --card: #1e1e1e; --text: #f0ece0; --text-muted: #9a9080;
    --radius: 16px; --whatsapp: #25D366; --req-color: #3498db;
  }
  body.light-mode {
    --dark: #f5f5f5; --dark2: #ffffff; --dark3: #eeeeee; --card: #ffffff;
    --text: #1a1a1a; --text-muted: #666666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: 0.3s; }
  
  header { position: sticky; top: 0; z-index: 100; background: rgba(var(--dark),0.95); background: var(--dark2); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--gold); cursor: pointer; }
  .logo-icon { width: 35px; height: 35px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #0f0f0f; }

  .theme-toggle { background: var(--dark3); border: 1px solid var(--gold); color: var(--gold); padding: 5px 10px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; }

  .hero { padding: 30px 20px; text-align: center; }
  .hero h1 { font-family: 'Tajawal', sans-serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
  .hero h1 .highlight { background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  
  .search-bar { display: flex; gap: 10px; max-width: 600px; margin: 0 auto 20px; background: var(--dark3); border: 1.5px solid rgba(201,168,76,0.25); border-radius: 14px; padding: 10px 15px; }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Cairo'; }
  
  .filter-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
  .pill { padding: 6px 15px; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.2); background: transparent; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  .pill.active { background: var(--gold); border-color: var(--gold); color: #0f0f0f; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 0 20px 80px; }
  .card { position: relative; background: var(--card); border-radius: var(--radius); border: 1px solid rgba(201,168,76,0.1); overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  .card.is-request { border: 2px solid var(--req-color); }
  
  .image-wrapper { position: relative; width: 100%; height: 200px; overflow: hidden; cursor: zoom-in; }
  .image-slider { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
  .image-slider::-webkit-scrollbar { display: none; }
  .slider-img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  
  .img-counter { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 5px; font-size: 0.7rem; z-index: 5; }
  .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
  .arrow-left { left: 10px; } .arrow-right { right: 10px; }

  .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 10; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .dot.active { background: var(--gold); }

  .status-badge { position: absolute; top: 10px; right: 10px; padding: 3px 10px; border-radius: 6px; font-weight: 800; font-size: 0.75rem; z-index: 15; }
  .status-available { background: var(--gold); color: #0f0f0f; }
  .status-reserved { background: #e67e22; color: white; }
  .status-sold { background: #ff4757; color: white; }
  .status-request { background: var(--req-color); color: white; }
  
  .card-body { padding: 15px; }
  .price { font-family: 'Tajawal'; font-weight: 800; font-size: 1.3rem; color: var(--gold); margin-bottom: 5px; }
  .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .card-info { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
  
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
  .btn { padding: 10px; border-radius: 10px; text-decoration: none; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.8rem; border: none; cursor: pointer; }
  .btn-call { background: var(--gold); color: #0f0f0f; }
  .btn-wa { background: var(--whatsapp); color: white; }
  .btn-share { grid-column: span 2; background: var(--dark3); color: var(--text); border: 1px solid var(--gold); margin-top: 2px; }
  
  /* Lightbox (الشاشة الكاملة للصور) */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
  #lightbox img { max-width: 95%; max-height: 80%; border-radius: 10px; object-fit: contain; }
  .close-lb { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; }

  .fab { position: fixed; bottom: 30px; left: 20px; width: 60px; height: 60px; border-radius: 15px; background: var(--gold); border: none; font-size: 35px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 500; box-shadow: 0 8px 25px rgba(201,168,76,0.4); }
  
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(5px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--dark2); border-radius: 20px; width: 100%; max-width: 450px; padding: 20px; border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto; }
  .form-control { width: 100%; background: var(--dark3); border: 1px solid #444; border-radius: 10px; padding: 10px; color: var(--text); margin-bottom: 10px; font-family: 'Cairo'; outline: none; }
  label { font-size: 0.8rem; color: var(--gold); margin-bottom: 3px; display: block; }
</style>
</head>
<body>

<header>
  <div class="logo" id="mainLogo">
    <div class="logo-icon">🏠</div>
    <div>سمسرني <span>عقارات بلدنا</span></div>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
</header>

<section class="hero">
  <h1>اوعى تدور على عقار<br> من غير <span class="highlight">سمسرني</span></h1>
  <div class="search-bar">
    <input type="text" placeholder="ابحث بالعنوان، السعر، أو مطلوب..." id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('all', 'all', this)">الكل</button>
    <button class="pill" onclick="setFilter('mode', 'request', this)">المطلوب 🔍</button>
    <button class="pill" onclick="setFilter('purpose', 'إيجار', this)">للإيجار</button>
    <button class="pill" onclick="setFilter('purpose', 'بيع', this)">للبيع</button>
    <button class="pill" onclick="setFilter('type', 'شقة', this)">شقق</button>
    <button class="pill" onclick="setFilter('type', 'محل', this)">محلات</button>
    <button class="pill" onclick="setFilter('type', 'أرض', this)">أراضي</button>
  </div>
</section>

<div class="grid" id="grid"></div>

<div id="lightbox">
  <span class="close-lb" onclick="this.parentElement.style.display='none'">×</span>
  <img id="lbImg" src="">
</div>

<button class="fab" id="adminBtn" onclick="openModal()">+</button>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 style="margin-bottom:15px; color:var(--gold); text-align:center;">إضافة إعلان جديد ✨</h2>
    
    <label>نوع الإعلان</label>
    <select id="f_mode" class="form-control" onchange="toggleUpload(this.value)">
      <option value="offer">معروض (عندي عقار)</option>
      <option value="request">مطلوب (أبحث عن عقار)</option>
    </select>

    <div id="uploadBox" style="background:var(--dark3); border:2px dashed var(--gold); border-radius:12px; padding:15px; text-align:center; margin-bottom:15px; cursor:pointer;" onclick="document.getElementById('fileInput').click()">
      <p>📸 اختر صور العقار</p>
      <input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleMultipleImages(this)">
      <div id="previewContainer" style="display:flex; gap:8px; overflow-x:auto; margin-top:10px;"></div>
    </div>

    <input type="text" id="f_title" class="form-control" placeholder="عنوان الإعلان">
    <div style="display:flex; gap:10px;">
      <select id="f_purpose" class="form-control"><option value="بيع">بيع</option><option value="إيجار">إيجار</option></select>
      <select id="f_type" class="form-control"><option value="شقة">شقة</option><option value="محل">محل</option><option value="أرض">أرض</option></select>
    </div>
    <input type="number" id="f_price" class="form-control" placeholder="السعر">
    <input type="text" id="f_area" class="form-control" placeholder="المنطقة / العنوان">
    <input type="tel" id="f_phone" class="form-control" placeholder="رقم الموبايل">
    
    <button class="btn btn-call" style="width: 100%;" id="publishBtn" onclick="saveToFirebase()">🚀 انشر الآن</button>
    <button onclick="closeModal()" style="background:none; border:none; color:gray; width:100%; margin-top:10px;">إلغاء</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allData = {};
  let currentFilters = { type: 'all', purpose: 'all', mode: 'all' };
  let imagesArray = [];

  // تفعيل وضع الأدمن باللوجو
  document.getElementById('mainLogo').onclick = async () => {
    const input = prompt("كلمة سر الأدمن:");
    if(!input) return;
    const snap = await db.ref('admin_pass').get();
    if(input === String(snap.val())) {
      localStorage.setItem('samsarny_admin', 'true');
      localStorage.setItem('samsarny_key', input);
      alert("أهلاً يا أدمن ✅"); location.reload();
    } else alert("خطأ! ❌");
  };

  function toggleTheme() { document.body.classList.toggle('light-mode'); }
  function toggleUpload(val) { document.getElementById('uploadBox').style.display = (val === 'request') ? 'none' : 'block'; }

  function handleMultipleImages(input) {
    const files = Array.from(input.files);
    const container = document.getElementById('previewContainer');
    container.innerHTML = ""; imagesArray = [];
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          let width = img.width, height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const b64 = canvas.toDataURL('image/jpeg', 0.6);
          imagesArray.push(b64);
          container.innerHTML += `<img src="${b64}" style="width:50px;height:50px;border-radius:5px;object-fit:cover;">`;
        };
      };
      reader.readAsDataURL(file);
    });
  }

  function openModal() { document.getElementById('addModal').classList.add('open'); }
  function closeModal() { document.getElementById('addModal').classList.remove('open'); }

  function saveToFirebase() {
    const btn = document.getElementById('publishBtn');
    const key = localStorage.getItem('samsarny_key') || prompt("كلمة السر:");
    if(!key) return;
    const data = {
      mode: document.getElementById('f_mode').value,
      title: document.getElementById('f_title').value,
      purpose: document.getElementById('f_purpose').value,
      type: document.getElementById('f_type').value,
      price: document.getElementById('f_price').value,
      area: document.getElementById('f_area').value,
      phone: document.getElementById('f_phone').value,
      images: imagesArray, status: "available", date: Date.now(), admin_pass: key 
    };
    if(!data.title || !data.phone) return alert("أكمل البيانات!");
    btn.innerText = "جاري الحفظ..."; btn.disabled = true;
    db.ref('properties').push(data).then(() => location.reload()).catch(() => {
      alert("خطأ أمان!"); btn.disabled = false; btn.innerText = "🚀 انشر الآن";
    });
  }

  function cycleStatus(id, s) {
    const k = localStorage.getItem('samsarny_key');
    const next = s === "available" ? "reserved" : (s === "reserved" ? "sold" : "available");
    db.ref().update({ [`properties/${id}/status`]: next, admin_pass: k });
  }

  function deleteProperty(id) {
    const k = localStorage.getItem('samsarny_key');
    if(confirm("حذف الإعلان؟")) db.ref().update({ [`properties/${id}`]: null, admin_pass: k });
  }

  function scrollSlider(id, dir, total) {
    const slider = document.getElementById(`slider-${id}`);
    slider.scrollBy({ left: dir * slider.clientWidth, behavior: 'smooth' });
    setTimeout(() => {
        const idx = Math.round(slider.scrollLeft / slider.clientWidth);
        document.getElementById(`count-${id}`).innerText = `${idx + 1} / ${total}`;
        document.querySelectorAll(`.dots-${id} .dot`).forEach((d, i) => d.classList.toggle('active', i === idx));
    }, 400);
  }

  function openLB(src) {
    const lb = document.getElementById('lightbox');
    document.getElementById('lbImg').src = src;
    lb.style.display = 'flex';
  }

  function share(t, a) {
    const txt = `${t} في ${a}\n${window.location.href}`;
    if (navigator.share) navigator.share({ title: 'سمسرني', text: txt, url: window.location.href });
    else prompt("انسخ الرابط:", window.location.href);
  }

  db.ref('properties').on('value', (snap) => {
    allData = snap.val() || {};
    applyFilters();
  });

  function setFilter(key, val, btn) {
    if(key === 'all') currentFilters = {type:'all', purpose:'all', mode:'all'};
    else {
        // تصفير الفلاتر التانية عشان يظهر النوع المطلوب بس
        currentFilters = {type:'all', purpose:'all', mode:'all'};
        currentFilters[key] = val;
    }
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('grid'); grid.innerHTML = "";
    const isAdmin = localStorage.getItem('samsarny_admin') === 'true';
    if(isAdmin) document.getElementById('adminBtn').style.display = 'flex';

    Object.keys(allData).reverse().forEach(id => {
      const item = allData[id];
      const mSearch = item.title.toLowerCase().includes(search) || item.area.toLowerCase().includes(search);
      const mType = currentFilters.type === 'all' || item.type === currentFilters.type;
      const mPurpose = currentFilters.purpose === 'all' || item.purpose === currentFilters.purpose;
      const mMode = currentFilters.mode === 'all' || item.mode === currentFilters.mode;

      if(mSearch && mType && mPurpose && mMode) {
        const isReq = item.mode === 'request';
        const imgs = item.images || [];
        let sCls = "status-available", sTxt = "متاح";
        if(isReq) { sCls = "status-request"; sTxt = "مطلوب 🔍"; }
        else if(item.status === "reserved") { sCls = "status-reserved"; sTxt = "تم الحجز"; }
        else if(item.status === "sold") { sCls = "status-sold"; sTxt = "تم البيع"; }

        const waMsg = encodeURIComponent(`أهلاً، بخصوص إعلان "${item.title}" في ${item.area} على موقع سمسرني..`);

        grid.innerHTML += `
          <div class="card ${isReq ? 'is-request' : ''}">
            ${isAdmin ? `<div class="admin-actions">
                <button class="admin-btn" onclick="cycleStatus('${id}', '${item.status || 'available'}')">الحالة</button>
                <button class="admin-btn" style="background:#dc3545" onclick="deleteProperty('${id}')">حذف</button>
            </div>` : ''}
            
            ${!isReq && imgs.length > 0 ? `
            <div class="image-wrapper">
              <div class="img-counter" id="count-${id}">1 / ${imgs.length}</div>
              ${imgs.length > 1 ? `<button class="slide-arrow arrow-left" onclick="scrollSlider('${id}', 1, ${imgs.length})">❮</button>` : ''}
              <div class="image-slider" id="slider-${id}">
                ${imgs.map(src => `<img src="${src}" class="slider-img" onclick="openLB('${src}')">`).join('')}
              </div>
              ${imgs.length > 1 ? `<button class="slide-arrow arrow-right" onclick="scrollSlider('${id}', -1, ${imgs.length})">❯</button>` : ''}
              <div class="slider-dots dots-${id}">${imgs.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}</div>
            </div>` : ''}

            <div class="status-badge ${sCls}">${sTxt}</div>
            
            <div class="card-body">
              <div class="price">${Number(item.price).toLocaleString()} ج.م</div>
              <h3 class="card-title">${item.title}</h3>
              <div class="card-info">📍 ${item.area} | 🏠 ${item.type}</div>
              <div class="actions">
                <a href="tel:${item.phone}" class="btn btn-call">📞 اتصال</a>
                <a href="https://wa.me/20${item.phone}?text=${waMsg}" target="_blank" class="btn btn-wa">💬 واتساب</a>
                <button class="btn btn-share" onclick="share('${item.title}', '${item.area}')">🔗 مشاركة</button>
              </div>
            </div>
          </div>`;
      }
    });
  }
</script>
</body>
</html>
