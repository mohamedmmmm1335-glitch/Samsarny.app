<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمسرني – عقارات بلدنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --dark: #0f0f0f; --dark2: #1a1a1a;
    --dark3: #242424; --card: #1e1e1e; --text: #f0ece0; --text-muted: #9a9080;
    --radius: 16px; --whatsapp: #25D366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  
  header { position: sticky; top: 0; z-index: 100; background: rgba(15,15,15,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--gold); cursor: pointer; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #0f0f0f; }

  .hero { position: relative; padding: 40px 24px; text-align: center; z-index: 1; }
  .hero h1 { font-family: 'Tajawal', sans-serif; font-size: clamp(2.2rem, 6vw, 3.5rem); font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
  .hero h1 .highlight { background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  
  .search-bar { display: flex; gap: 10px; max-width: 640px; margin: 0 auto 20px; background: var(--dark2); border: 1.5px solid rgba(201,168,76,0.25); border-radius: 14px; padding: 12px 16px; align-items: center; }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Cairo'; font-size: 1rem; }
  
  .filter-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .pill { padding: 8px 18px; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.2); background: transparent; color: var(--text-muted); cursor: pointer; transition: 0.3s; font-weight: 600; }
  .pill.active { background: var(--gold); border-color: var(--gold); color: #0f0f0f; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; padding: 0 24px 80px; }
  .card { position: relative; background: var(--card); border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.06); overflow: hidden; }
  
  /* ستايل السلايدر المتطور مع الأسهم */
  .image-wrapper { position: relative; width: 100%; height: 220px; overflow: hidden; }
  .image-slider { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
  .image-slider::-webkit-scrollbar { display: none; }
  .slider-img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; background: #222; }
  
  .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(4px); font-weight: bold; }
  .arrow-left { left: 10px; }
  .arrow-right { right: 10px; }

  .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; z-index: 15; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .status-available { background: var(--gold); color: #0f0f0f; }
  .status-reserved { background: #3498db; color: white; }
  .status-sold { background: #ff4757; color: white; }
  
  .card-body { padding: 20px; }
  .price { font-family: 'Tajawal'; font-weight: 900; font-size: 1.4rem; color: var(--gold); margin-bottom: 8px; }
  .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
  .card-info { color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  .btn { padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; border: none; cursor: pointer; }
  .btn-call { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #0f0f0f; }
  .btn-wa { background: var(--whatsapp); color: white; }
  
  .admin-actions { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 5px; z-index: 20; }
  .admin-btn { background: rgba(0,0,0,0.8); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.75rem; backdrop-filter: blur(4px); }

  .fab { position: fixed; bottom: 35px; left: 25px; width: 65px; height: 65px; border-radius: 20px; background: var(--gold); border: none; font-size: 40px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 500; box-shadow: 0 10px 30px rgba(201,168,76,0.5); }
  
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--dark2); border-radius: 24px; width: 100%; max-width: 480px; padding: 30px; border: 1.5px solid rgba(201,168,76,0.3); max-height: 90vh; overflow-y: auto; }
  .form-control { width: 100%; background: var(--dark3); border: 1.5px solid #333; border-radius: 12px; padding: 14px; color: white; margin-bottom: 15px; font-family: 'Cairo'; outline: none; }
  
  #previewContainer { display: flex; gap: 10px; overflow-x: auto; margin-top: 15px; padding-bottom: 10px; }
  .preview-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; border: 1px solid var(--gold); flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="adminAccess()">
    <div class="logo-icon">🏠</div>
    <div>سمسرني <span>عقارات بلدنا</span></div>
  </div>
</header>

<section class="hero">
  <h1>اوعى تدور على عقار<br> من غير <span class="highlight">سمسرني</span></h1>
  <div class="search-bar">
    <input type="text" placeholder="ابحث بالعنوان، المنطقة، أو السعر..." id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('type', 'all', this)">الكل</button>
    <button class="pill" onclick="setFilter('purpose', 'إيجار', this)">للإيجار</button>
    <button class="pill" onclick="setFilter('purpose', 'بيع', this)">للبيع</button>
    <button class="pill" onclick="setFilter('type', 'شقة', this)">شقق</button>
    <button class="pill" onclick="setFilter('type', 'محل', this)">محلات</button>
  </div>
</section>

<div class="grid" id="grid"></div>

<button class="fab" id="adminBtn" onclick="openModal()">+</button>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 style="margin-bottom:20px; color:var(--gold); text-align:center;">إضافة عقار جديد ✨</h2>
    <div style="background:var(--dark3); border:2px dashed #444; border-radius:16px; padding:20px; text-align:center;" onclick="document.getElementById('fileInput').click()">
      <p id="uploadStatus">📸 اختر صور العقار</p>
      <input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleMultipleImages(this)">
      <div id="previewContainer"></div>
    </div>
    <br>
    <input type="text" id="f_title" class="form-control" placeholder="عنوان الإعلان">
    <div style="display:flex; gap:10px;">
      <select id="f_purpose" class="form-control"><option value="بيع">بيع</option><option value="إيجار">إيجار</option></select>
      <select id="f_type" class="form-control"><option value="شقة">شقة</option><option value="محل">محل</option></select>
    </div>
    <input type="number" id="f_price" class="form-control" placeholder="السعر">
    <input type="text" id="f_area" class="form-control" placeholder="المنطقة">
    <input type="tel" id="f_phone" class="form-control" placeholder="رقم الموبايل">
    <button class="btn btn-call" style="width: 100%;" id="publishBtn" onclick="saveToFirebase()">🚀 انشر الآن</button>
    <button onclick="closeModal()" style="background:none; border:none; color:gray; width:100%; margin-top:15px;">إلغاء</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allData = {};
  let currentFilters = { type: 'all', purpose: 'all' };
  let imagesArray = [];

  async function adminAccess() {
    const input = prompt("أدخل كلمة السر:");
    if(!input) return;
    try {
      const snap = await db.ref('admin_pass').get();
      if(input === String(snap.val())) {
        localStorage.setItem('samsarny_admin', 'true');
        localStorage.setItem('samsarny_key', input);
        alert("تم تفعيل وضع الإدارة ✅");
        location.reload();
      } else { alert("كلمة السر خطأ! ❌"); }
    } catch (e) { alert("خطأ في الاتصال"); }
  }

  function handleMultipleImages(input) {
    const files = Array.from(input.files);
    const container = document.getElementById('previewContainer');
    container.innerHTML = ""; imagesArray = [];
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          let width = img.width, height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const base64 = canvas.toDataURL('image/jpeg', 0.5);
          imagesArray.push(base64);
          const thumb = document.createElement('img');
          thumb.src = base64; thumb.className = 'preview-thumb';
          container.appendChild(thumb);
        };
      };
      reader.readAsDataURL(file);
    });
  }

  function openModal() { document.getElementById('addModal').classList.add('open'); }
  function closeModal() { document.getElementById('addModal').classList.remove('open'); }

  function saveToFirebase() {
    const btn = document.getElementById('publishBtn');
    let savedKey = localStorage.getItem('samsarny_key');
    if(!savedKey) { savedKey = prompt("أدخل كلمة السر للنشر:"); if(!savedKey) return; }

    const data = {
      title: document.getElementById('f_title').value,
      purpose: document.getElementById('f_purpose').value,
      type: document.getElementById('f_type').value,
      price: document.getElementById('f_price').value,
      area: document.getElementById('f_area').value,
      phone: document.getElementById('f_phone').value,
      images: imagesArray, 
      status: "available", // الحالة الافتراضية
      date: Date.now(),
      admin_pass: savedKey 
    };

    if(!data.title || imagesArray.length === 0) return alert("أكمل البيانات!");
    btn.innerText = "جاري النشر..."; btn.disabled = true;

    db.ref('properties').push(data).then(() => location.reload())
    .catch(() => { alert("خطأ في الأمان!"); btn.disabled = false; btn.innerText = "🚀 انشر الآن"; });
  }

  // دالة لتغيير الحالة بين (متاح - تم الحجز - تم البيع)
  function cycleStatus(id, currentStatus) {
    const savedKey = localStorage.getItem('samsarny_key');
    let nextStatus = "available";
    if(currentStatus === "available") nextStatus = "reserved";
    else if(currentStatus === "reserved") nextStatus = "sold";
    
    db.ref().update({ [`properties/${id}/status`]: nextStatus, admin_pass: savedKey });
  }

  function deleteProperty(id) {
    const savedKey = localStorage.getItem('samsarny_key');
    if(confirm("هل تريد حذف هذا الإعلان نهائياً؟")) db.ref().update({ [`properties/${id}`]: null, admin_pass: savedKey });
  }

  function scrollSlider(id, direction) {
    const slider = document.getElementById(`slider-${id}`);
    const scrollAmount = slider.clientWidth;
    slider.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
  }

  db.ref('properties').on('value', (snap) => {
    allData = snap.val() || {};
    applyFilters();
  });

  function setFilter(key, val, btn) {
    if(key === 'type' && val === 'all') { currentFilters.type = 'all'; currentFilters.purpose = 'all'; }
    else { currentFilters[key] = val; }
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('grid');
    grid.innerHTML = "";
    const isAdmin = localStorage.getItem('samsarny_admin') === 'true';
    if(isAdmin) document.getElementById('adminBtn').style.display = 'flex';

    Object.keys(allData).reverse().forEach(id => {
      const item = allData[id];
      const matchSearch = item.title.toLowerCase().includes(search) || item.area.toLowerCase().includes(search);
      const matchType = currentFilters.type === 'all' || item.type === currentFilters.type;
      const matchPurpose = currentFilters.purpose === 'all' || item.purpose === currentFilters.purpose;

      if(matchSearch && matchType && matchPurpose) {
        const imgs = item.images || [];
        // تحديد كلاس الحالة والاسم
        let statusClass = "status-available", statusText = "متاح";
        if(item.status === "reserved") { statusClass = "status-reserved"; statusText = "تم الحجز"; }
        else if(item.status === "sold" || item.sold === true) { statusClass = "status-sold"; statusText = "تم البيع"; }

        grid.innerHTML += `
          <div class="card">
            ${isAdmin ? `<div class="admin-actions">
                <button class="admin-btn" onclick="cycleStatus('${id}', '${item.status || (item.sold ? 'sold' : 'available')}')">تغيير الحالة</button>
                <button class="admin-btn" style="background:#dc3545" onclick="deleteProperty('${id}')">حذف</button>
            </div>` : ''}
            
            <div class="image-wrapper">
              ${imgs.length > 1 ? `<button class="slide-arrow arrow-left" onclick="scrollSlider('${id}', -1)">❮</button>` : ''}
              <div class="image-slider" id="slider-${id}">
                ${imgs.map(src => `<img src="${src}" class="slider-img">`).join('')}
              </div>
              ${imgs.length > 1 ? `<button class="slide-arrow arrow-right" onclick="scrollSlider('${id}', 1)">❯</button>` : ''}
            </div>

            <div class="status-badge ${statusClass}">${statusText}</div>
            
            <div class="card-body">
              <div class="price">${Number(item.price).toLocaleString()} ج.م</div>
              <h3 class="card-title">${item.title}</h3>
              <div class="card-info">📍 ${item.area}</div>
              <div class="actions">
                <a href="tel:${item.phone}" class="btn btn-call">📞 اتصال</a>
                <a href="https://wa.me/20${item.phone}" class="btn btn-wa">💬 واتساب</a>
              </div>
            </div>
          </div>`;
      }
    });
  }
</script>
</body>
</html>
