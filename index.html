<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمسرني – عقارات بلدنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --dark: #0f0f0f; --dark2: #1a1a1a;
    --dark3: #242424; --card: #1e1e1e; --text: #f0ece0; --text-muted: #9a9080;
    --radius: 16px; --whatsapp: #25D366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.07) 0%, transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(201,168,76,0.05) 0%, transparent 50%); pointer-events: none; z-index: 0; }
  
  header { position: sticky; top: 0; z-index: 100; background: rgba(15,15,15,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Tajawal', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--gold); cursor: pointer; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #0f0f0f; }
  .logo span { color: var(--text); font-weight: 400; font-size: 0.9rem; display: block; line-height: 1; }

  .hero { position: relative; padding: 40px 24px; text-align: center; z-index: 1; }
  .hero h1 { font-family: 'Tajawal', sans-serif; font-size: clamp(2.2rem, 6vw, 3.5rem); font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
  .hero h1 .highlight { background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: 0 10px 20px rgba(201,168,76,0.2); }
  
  .search-bar { display: flex; gap: 10px; max-width: 640px; margin: 0 auto 16px; background: var(--dark2); border: 1.5px solid rgba(201,168,76,0.25); border-radius: 14px; padding: 12px 16px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Cairo'; font-size: 1rem; }
  
  .filter-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .pill { padding: 8px 18px; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.2); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 600; }
  .pill.active { background: var(--gold); border-color: var(--gold); color: #0f0f0f; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(201,168,76,0.3); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; padding: 0 24px 80px; position: relative; z-index: 1; }
  .card { position: relative; background: var(--card); border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.06); overflow: hidden; transition: transform 0.3s ease; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
  .card:hover { transform: translateY(-8px); border-color: rgba(201,168,76,0.3); }
  .card-img-container { position: relative; width: 100%; height: 220px; overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; background: #2a2a2a; border-bottom: 1px solid rgba(201,168,76,0.1); }
  
  .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; background: var(--gold); color: #0f0f0f; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .status-sold { background: #ff4757; color: white; }
  
  .card-body { padding: 20px; }
  .price { font-family: 'Tajawal'; font-weight: 900; font-size: 1.4rem; color: var(--gold); margin-bottom: 8px; }
  .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
  .card-info { color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  .btn { padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; transition: 0.3s; border: none; cursor: pointer; }
  .btn-call { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #0f0f0f; }
  .btn-wa { background: var(--whatsapp); color: white; }
  
  .admin-actions { position: absolute; left: 12px; top: 12px; display: flex; gap: 5px; z-index: 10; }
  .admin-btn { background: rgba(0,0,0,0.7); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.8rem; backdrop-filter: blur(4px); }
  .btn-del { background: rgba(220, 53, 69, 0.9); }

  .fab { position: fixed; bottom: 35px; left: 25px; width: 65px; height: 65px; border-radius: 20px; background: var(--gold); border: none; font-size: 40px; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 500; box-shadow: 0 10px 30px rgba(201,168,76,0.5); transition: 0.3s; }
  .fab:hover { transform: rotate(90deg) scale(1.1); }
  
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--dark2); border-radius: 24px; width: 100%; max-width: 480px; padding: 30px; border: 1.5px solid rgba(201,168,76,0.3); max-height: 90vh; overflow-y: auto; }
  .form-control { width: 100%; background: var(--dark3); border: 1.5px solid #333; border-radius: 12px; padding: 14px; color: white; margin-bottom: 15px; font-family: 'Cairo'; font-size: 1rem; outline: none; transition: 0.3s; }
  .form-control:focus { border-color: var(--gold); background: #2a2a2a; }
  .img-upload-box { background: var(--dark3); border: 2px dashed #444; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 20px; }
  #previewImg { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; display: none; margin-top: 10px; border: 1px solid var(--gold); }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="adminAccess()">
    <div class="logo-icon">🏠</div>
    <div>سمسرني <span>عقارات بلدنا</span></div>
  </div>
</header>

<section class="hero">
  <h1>اوعى تدور على عقار<br> من غير <span class="highlight">سمسرني</span></h1>
  <div class="search-bar">
    <input type="text" placeholder="ابحث بالعنوان، المنطقة، أو علامة مميزة..." id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('type', 'all', this)">الكل</button>
    <button class="pill" onclick="setFilter('purpose', 'إيجار', this)">للإيجار</button>
    <button class="pill" onclick="setFilter('purpose', 'بيع', this)">للبيع</button>
    <button class="pill" onclick="setFilter('type', 'شقة', this)">شقق</button>
    <button class="pill" onclick="setFilter('type', 'محل', this)">محلات</button>
    <button class="pill" onclick="setFilter('type', 'أرض', this)">أراضي</button>
  </div>
</section>

<div class="grid" id="grid"></div>

<button class="fab" id="adminBtn" onclick="openModal()">+</button>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 style="margin-bottom:20px; color:var(--gold); text-align:center;">إضافة عقار جديد ✨</h2>
    <div class="img-upload-box" onclick="document.getElementById('fileInput').click()">
      <p id="uploadStatus" style="color:var(--text-muted); font-size:0.9rem;">📸 اختر صورة (يتم ضغطها للتسريع)</p>
      <input type="file" id="fileInput" hidden accept="image/*" onchange="handleImage(this)">
      <img id="previewImg">
    </div>
    <input type="text" id="f_title" class="form-control" placeholder="عنوان الإعلان">
    <div style="display:flex; gap:10px;">
      <select id="f_purpose" class="form-control"><option value="بيع">بيع</option><option value="إيجار">إيجار</option></select>
      <select id="f_type" class="form-control"><option value="شقة">شقة</option><option value="محل">محل</option><option value="أرض">أرض</option></select>
    </div>
    <input type="number" id="f_price" class="form-control" placeholder="السعر بالجنيه">
    <input type="text" id="f_area" class="form-control" placeholder="المنطقة أو الشارع">
    <input type="text" id="f_landmark" class="form-control" placeholder="علامة مميزة">
    <input type="tel" id="f_phone" class="form-control" placeholder="رقم الموبايل">
    <button class="btn btn-call" style="width: 100%; border: none; cursor:pointer;" id="publishBtn" onclick="saveToFirebase()">🚀 انشر الإعلان الآن</button>
    <button onclick="closeModal()" style="background:none; border:none; color:rgba(255,255,255,0.4); width:100%; margin-top:15px; cursor:pointer; font-family:'Cairo'">إلغاء الأمر</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allData = {};
  let currentFilters = { type: 'all', purpose: 'all' };
  let base64Image = "";

  async function adminAccess() {
    const input = prompt("أدخل كلمة السر:");
    if(!input) return;
    try {
      const snap = await db.ref('admin_pass').get();
      if(input === String(snap.val())) {
        document.getElementById('adminBtn').style.display = 'flex';
        localStorage.setItem('samsarny_admin', 'true');
        applyFilters();
      }
    } catch (e) {}
  }

  function handleImage(input) {
    const file = input.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let width = img.width; let height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          base64Image = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('previewImg').src = base64Image;
          document.getElementById('previewImg').style.display = 'block';
        };
      };
      reader.readAsDataURL(file);
    }
  }

  function openModal() { document.getElementById('addModal').classList.add('open'); }
  function closeModal() { document.getElementById('addModal').classList.remove('open'); }

  function saveToFirebase() {
    const btn = document.getElementById('publishBtn');
    const data = {
      title: document.getElementById('f_title').value,
      purpose: document.getElementById('f_purpose').value,
      type: document.getElementById('f_type').value,
      price: document.getElementById('f_price').value,
      area: document.getElementById('f_area').value,
      landmark: document.getElementById('f_landmark').value,
      phone: document.getElementById('f_phone').value,
      img: base64Image, sold: false, date: Date.now()
    };
    if(!data.title || !data.price || !data.phone) return alert("أكمل البيانات!");
    btn.innerText = "جاري النشر..."; btn.disabled = true;
    db.ref('properties').push(data).then(() => { closeModal(); location.reload(); });
  }

  function toggleSold(id, currentStatus) {
    db.ref('properties/' + id).update({ sold: !currentStatus });
  }

  function deleteProperty(id) {
    if(confirm("حذف؟")) db.ref('properties/' + id).remove();
  }

  db.ref('properties').on('value', (snap) => {
    allData = snap.val() || {};
    applyFilters();
  });

  function setFilter(key, val, btn) {
    if(key === 'type' && val === 'all') { currentFilters.type = 'all'; currentFilters.purpose = 'all'; }
    else { currentFilters[key] = val; }
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('grid');
    grid.innerHTML = "";
    const isAdmin = localStorage.getItem('samsarny_admin') === 'true';
    if(isAdmin) document.getElementById('adminBtn').style.display = 'flex';

    Object.keys(allData).reverse().forEach(id => {
      const item = allData[id];
      const matchSearch = item.title.toLowerCase().includes(search) || item.area.toLowerCase().includes(search);
      const matchType = currentFilters.type === 'all' || item.type === currentFilters.type;
      const matchPurpose = currentFilters.purpose === 'all' || item.purpose === currentFilters.purpose;

      if(matchSearch && matchType && matchPurpose) {
        grid.innerHTML += `
          <div class="card">
            ${isAdmin ? `<div class="admin-actions"><button class="admin-btn" onclick="toggleSold('${id}', ${item.sold})">${item.sold ? 'متاح' : 'تم البيع'}</button><button class="admin-btn btn-del" onclick="deleteProperty('${id}')">حذف</button></div>` : ''}
            <div class="card-img-container">
              ${item.sold ? `<div class="status-badge status-sold">تم ال${item.purpose === 'بيع' ? 'بيع' : 'تأجير'} ✅</div>` : `<div class="status-badge">متاح الآن</div>`}
              ${item.img ? `<img src="${item.img}" class="card-img" loading="lazy">` : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;background:#1a1a1a;">🏠</div>`}
            </div>
            <div class="card-body">
              <div class="price">${Number(item.price).toLocaleString()} ج.م</div>
              <h3 class="card-title">${item.title}</h3>
              <div class="card-info">📍 ${item.area}</div>
              ${item.landmark ? `<div class="card-info" style="color:var(--gold-light)">🚩 ${item.landmark}</div>` : ''}
              <div class="actions">
                <a href="tel:${item.phone}" class="btn btn-call">📞 اتصال</a>
                <a href="https://wa.me/20${item.phone}?text=إعلان ${item.title}" class="btn btn-wa">💬 واتساب</a>
              </div>
            </div>
          </div>`;
      }
    });
  }
</script>
</body>
</html>
