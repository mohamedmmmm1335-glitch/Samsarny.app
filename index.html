<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمسرني – النسخة الذهبية V29</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --dark: #0f0f0f; --dark2: #1a1a1a;
    --dark3: #242424; --card: #1e1e1e; --text: #f0ece0; --text-muted: #9a9080;
    --radius: 16px; --whatsapp: #25D366; --req-color: #3498db; --verify: #00b894;
  }
  body.light-mode { --dark: #f5f5f5; --dark2: #ffffff; --dark3: #eeeeee; --card: #ffffff; --text: #1a1a1a; --text-muted: #666666; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: 0.3s; }
  
  header { position: sticky; top: 0; z-index: 100; background: var(--dark2); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--gold); cursor: pointer; }
  .logo-icon { width: 35px; height: 35px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #0f0f0f; }

  .hero { padding: 30px 20px; text-align: center; }
  .highlight { background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
  
  .search-bar { display: flex; gap: 10px; max-width: 600px; margin: 0 auto 20px; background: var(--dark3); border: 1.5px solid rgba(201,168,76,0.25); border-radius: 14px; padding: 10px 15px; }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Cairo'; width: 100%; }
  
  .filter-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
  .pill { padding: 6px 15px; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.2); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .pill.active { background: var(--gold); color: #0f0f0f; border-color: var(--gold); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 0 20px 100px; }
  .card { position: relative; background: var(--card); border-radius: var(--radius); border: 1px solid rgba(201,168,76,0.1); overflow: hidden; }
  
  .image-wrapper { position: relative; width: 100%; height: 230px; overflow: hidden; background: #000; }
  .image-slider { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .image-slider::-webkit-scrollbar { display: none; }
  .slider-item { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  
  .img-counter { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 5px; font-size: 0.75rem; z-index: 5; }
  .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.2rem; }
  .arrow-left { left: 8px; } .arrow-right { right: 8px; }

  .status-badge { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.75rem; z-index: 15; }
  .status-available { background: var(--gold); color: #000; }
  .status-reserved { background: #e67e22; color: white; }
  .status-sold { background: #ff4757; color: white; }
  .status-request { background: var(--req-color); color: white; }
  
  .card-body { padding: 18px; }
  .price { font-weight: 900; font-size: 1.5rem; color: var(--gold); font-family: 'Tajawal'; }
  .card-title { font-size: 1.2rem; font-weight: 700; margin: 8px 0; }
  
  .ad-banner { grid-column: 1 / -1; background: linear-gradient(45deg, var(--dark2), var(--dark3)); border: 2px dashed var(--gold); border-radius: 16px; padding: 25px; text-align: center; color: var(--gold); font-weight: 900; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
  .btn { padding: 12px; border-radius: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.85rem; cursor: pointer; border: none; text-decoration: none; }
  .btn-call { background: var(--gold); color: #000; }
  .btn-wa { background: var(--whatsapp); color: white; }
  .btn-share { grid-column: span 2; background: var(--dark3); color: var(--text); border: 1px solid var(--gold); }

  .admin-actions { position: absolute; left: 10px; top: 45px; display: flex; flex-direction: column; gap: 5px; z-index: 30; }
  .admin-btn { background: rgba(0,0,0,0.8); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 5px 8px; font-size: 0.7rem; cursor: pointer; }

  .fab { position: fixed; bottom: 30px; left: 20px; width: 60px; height: 60px; border-radius: 18px; background: var(--gold); font-size: 35px; display: none; align-items: center; justify-content: center; z-index: 500; border: none; box-shadow: 0 8px 25px rgba(201,168,76,0.4); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; }
  .modal-overlay.open { display: flex !important; }
  .modal { background: var(--dark2); border-radius: 20px; width: 100%; max-width: 450px; padding: 20px; border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto; }
  .form-control { width: 100%; background: var(--dark3); border: 1.5px solid #444; border-radius: 10px; padding: 12px; color: var(--text); margin-bottom: 12px; font-family: 'Cairo'; outline: none; }
</style>
</head>
<body id="body">

<header>
  <div class="logo" onclick="adminLogin()">
    <div class="logo-icon">🏠</div>
    <div>سمسرني <span style="font-size: 0.6rem; display: block; color: var(--text-muted);">عقارات بلدنا</span></div>
  </div>
  <button class="theme-toggle" onclick="document.getElementById('body').classList.toggle('light-mode')">🌓</button>
</header>

<section class="hero">
  <h1>عقارك بلمسة<br><span class="highlight">سمسرني</span></h1>
  <div class="search-bar">
    <input type="text" placeholder="ابحث بالمنطقة، السعر، النوع..." id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('all', 'all', this)">الكل</button>
    <button class="pill" onclick="setFilter('purpose', 'بيع', this)">بيع</button>
    <button class="pill" onclick="setFilter('purpose', 'إيجار', this)">إيجار</button>
    <button class="pill" onclick="setFilter('type', 'شقة', this)">شقق</button>
    <button class="pill" onclick="setFilter('type', 'محل', this)">محلات</button>
    <button class="pill" onclick="setFilter('type', 'أرض', this)">أراضي</button>
    <button class="pill" onclick="setFilter('type', 'عمارة', this)">عمارات</button>
  </div>
</section>

<div class="grid" id="grid"></div>

<button class="fab" id="adminBtn" onclick="openModal()">+</button>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 id="mTitle" style="text-align:center; color:var(--gold); margin-bottom:15px;">إضافة عقار</h2>
    <input type="hidden" id="edit_id">
    
    <select id="f_mode" class="form-control" onchange="document.getElementById('uBox').style.display=(this.value=='request'?'none':'block')">
      <option value="offer">معروض</option>
      <option value="request">مطلوب</option>
    </select>
    <div style="margin-bottom:12px; color:var(--gold); display:flex; align-items:center; gap:8px;"><input type="checkbox" id="f_verify"> توثيق (Verify ✅)</div>
    <div id="uBox" style="border:2px dashed var(--gold); padding:20px; text-align:center; margin-bottom:12px;" onclick="document.getElementById('fInp').click()">
      <p id="upStatus">📸 ارفع الصور/الفيديو</p>
      <input type="file" id="fInp" hidden multiple accept="image/*,video/*" onchange="handleMedia(this)">
    </div>
    <input type="text" id="f_t" class="form-control" placeholder="العنوان">
    <div style="display:flex; gap:10px;">
      <select id="f_p" class="form-control"><option value="بيع">بيع</option><option value="إيجار">إيجار</option></select>
      <select id="f_ty" class="form-control"><option value="شقة">شقة</option><option value="محل">محل</option><option value="أرض">أرض</option><option value="عمارة">عمارة</option></select>
    </div>
    <select id="f_st" class="form-control">
      <option value="available">متاح</option>
      <option value="reserved">تم الحجز</option>
      <option value="sold">تم البيع</option>
    </select>
    <input type="number" id="f_pr" class="form-control" placeholder="السعر">
    <input type="text" id="f_a" class="form-control" placeholder="المنطقة">
    <input type="tel" id="f_ph" class="form-control" placeholder="الموبايل">
    <button class="btn btn-call" style="width:100%" onclick="save()">🚀 تنفيذ</button>
    <button onclick="closeModal()" style="width:100%; border:none; background:none; color:gray; margin-top:10px;">إلغاء</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allData = {}, currentFilters = {type:'all', purpose:'all', mode:'all'}, mediaArray = [];

  function adminLogin() {
    const p = prompt("الباسورد:");
    db.ref('admin_pass').get().then(s => {
      if(p === String(s.val())) { localStorage.setItem('is_admin','true'); location.reload(); }
    });
  }

  async function handleMedia(input) {
    const files = Array.from(input.files);
    document.getElementById('upStatus').innerText = "⏳ جاري الرفع...";
    mediaArray = [];
    for (let f of files) {
      const b64 = await new Promise(res => {
        const r = new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f);
      });
      mediaArray.push({type: f.type.startsWith('image')?'image':'video', src: b64});
    }
    document.getElementById('upStatus').innerText = "✅ تم الرفع";
  }

  function openModal(id = null) {
    document.getElementById('addModal').classList.add('open');
    if(id) {
      const item = allData[id];
      document.getElementById('edit_id').value = id;
      document.getElementById('f_t').value = item.title;
      document.getElementById('f_pr').value = item.price;
      document.getElementById('f_a').value = item.area;
      document.getElementById('f_ph').value = item.phone;
      document.getElementById('f_st').value = item.status || 'available';
      document.getElementById('f_verify').checked = item.isVerified;
      mediaArray = item.media || [];
      document.getElementById('mTitle').innerText = "تعديل العقار";
    }
  }

  function closeModal() { document.getElementById('addModal').classList.remove('open'); }

  function save() {
    const id = document.getElementById('edit_id').value;
    const data = {
      mode: document.getElementById('f_mode').value, title: document.getElementById('f_t').value,
      purpose: document.getElementById('f_p').value, type: document.getElementById('f_ty').value,
      price: document.getElementById('f_pr').value, area: document.getElementById('f_a').value,
      phone: document.getElementById('f_ph').value, media: mediaArray, 
      status: document.getElementById('f_st').value, isVerified: document.getElementById('f_verify').checked, date: Date.now()
    };
    if(id) db.ref('properties/'+id).update(data).then(()=>location.reload());
    else db.ref('properties').push(data).then(()=>location.reload());
  }

  db.ref('properties').on('value', snap => { allData = snap.val() || {}; applyFilters(); });

  function setFilter(key, val, btn) {
    currentFilters = {type:'all', purpose:'all', mode:'all'};
    currentFilters[key] = val;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('grid'); grid.innerHTML = "";
    const isAdmin = localStorage.getItem('is_admin') === 'true';
    if(isAdmin) document.getElementById('adminBtn').style.display = 'flex';

    let count = 0;
    Object.keys(allData).reverse().forEach(id => {
      const item = allData[id];
      const matchSearch = item.title.toLowerCase().includes(search) || item.area.toLowerCase().includes(search);
      const matchType = currentFilters.type==='all' || item.type===currentFilters.type;
      const matchPurpose = currentFilters.purpose==='all' || item.purpose===currentFilters.purpose;

      if(matchSearch && matchType && matchPurpose) {
        count++;
        const media = item.media || [];
        const st = item.status || 'available';
        grid.innerHTML += `
          <div class="card">
            ${isAdmin ? `<div class="admin-actions">
              <button class="admin-btn" onclick="openModal('${id}')">تعديل ✏️</button>
              <button class="admin-btn" style="background:red" onclick="if(confirm('حذف؟'))db.ref('properties/${id}').remove()">حذف 🗑️</button>
            </div>` : ''}
            <div class="image-wrapper">
              <div class="img-counter" id="c-${id}">1 / ${media.length || 1}</div>
              <div class="image-slider" id="s-${id}" onscroll="updateC('${id}', ${media.length})">
                ${media.map(m => m.type==='video' ? `<video src="${m.src}" class="slider-item" loop muted onclick="this.play()"></video>` : `<img src="${m.src}" class="slider-item">`).join('') || '<img src="https://via.placeholder.com/400x300?text=No+Image" class="slider-item">'}
              </div>
            </div>
            <div class="status-badge status-${st}">${st==='available'?'متاح':(st==='reserved'?'محجوز':'مباع')}</div>
            <div class="card-body">
              ${item.isVerified ? `<div style="color:var(--verify); font-weight:bold; font-size:0.75rem;">✅ موثق</div>` : ''}
              <div class="price">${Number(item.price).toLocaleString()} ج.م</div>
              <h3 class="card-title">${item.title}</h3>
              <p>📍 ${item.area} | ${item.purpose}</p>
              <div class="actions">
                <a href="tel:${item.phone}" class="btn btn-call">📞 اتصال</a>
                <a href="https://wa.me/20${item.phone}" class="btn btn-wa">واتساب</a>
                <button class="btn btn-share" onclick="navigator.share({url:location.href})">🔗 مشاركة</button>
              </div>
            </div>
          </div>`;
        if(count % 3 === 0) grid.innerHTML += `<div class="ad-banner">📢 إعلان: سمسرني بيخلصك في ثانية!</div>`;
      }
    });
  }

  function updateC(id, total) {
    const slider = document.getElementById(`s-${id}`);
    const idx = Math.round(slider.scrollLeft / slider.clientWidth);
    document.getElementById(`c-${id}`).innerText = `${Math.abs(idx)+1} / ${total}`;
  }
</script>
</body>
</html>
