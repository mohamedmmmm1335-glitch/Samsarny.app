<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمسرني – النسخة العملاقة V22</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --dark: #0f0f0f; --dark2: #1a1a1a;
    --dark3: #242424; --card: #1e1e1e; --text: #f0ece0; --text-muted: #9a9080;
    --radius: 16px; --whatsapp: #25D366; --req-color: #3498db; --verify: #00b894;
  }
  body.light-mode { --dark: #f5f5f5; --dark2: #ffffff; --dark3: #eeeeee; --card: #ffffff; --text: #1a1a1a; --text-muted: #666666; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; transition: 0.3s; overflow-x: hidden; }
  
  /* Header & Logo */
  header { position: sticky; top: 0; z-index: 100; background: var(--dark2); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--gold); cursor: pointer; font-size: 1.2rem; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(201,168,76,0.3); }

  /* Hero & Filters */
  .hero { padding: 40px 20px; text-align: center; background: radial-gradient(circle at top, rgba(201,168,76,0.05), transparent); }
  .highlight { background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
  .search-bar { display: flex; gap: 10px; max-width: 600px; margin: 25px auto; background: var(--dark3); border: 1.5px solid rgba(201,168,76,0.2); border-radius: 15px; padding: 12px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Cairo'; font-size: 1rem; }
  
  .filter-pills { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
  .pill { padding: 8px 18px; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.15); background: var(--dark2); color: var(--text-muted); cursor: pointer; transition: 0.3s; font-size: 0.9rem; font-weight: 600; }
  .pill.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 4px 12px rgba(201,168,76,0.3); }

  /* Property Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 0 20px 100px; }
  .card { position: relative; background: var(--card); border-radius: var(--radius); border: 1px solid rgba(201,168,76,0.1); overflow: hidden; transition: 0.3s; }
  .card:hover { transform: translateY(-5px); border-color: var(--gold); }

  /* Slider System */
  .image-wrapper { position: relative; width: 100%; height: 230px; background: #000; overflow: hidden; }
  .image-slider { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .image-slider::-webkit-scrollbar { display: none; }
  .slider-item { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  video.slider-item { object-fit: contain; background: #000; }
  
  .img-counter { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; z-index: 10; backdrop-filter: blur(4px); }
  .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; z-index: 11; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .slide-arrow:active { scale: 0.9; background: var(--gold); }
  .arrow-left { left: 10px; } .arrow-right { right: 10px; }

  .status-badge { position: absolute; top: 12px; right: 12px; padding: 5px 12px; border-radius: 8px; font-weight: 800; font-size: 0.75rem; z-index: 12; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .status-available { background: var(--gold); color: #000; }
  .status-reserved { background: #e67e22; color: #fff; }
  .status-sold { background: #ff4757; color: #fff; }

  /* Card Body */
  .card-body { padding: 18px; }
  .verify-badge { color: var(--verify); font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .price { font-weight: 900; font-size: 1.6rem; color: var(--gold); font-family: 'Tajawal'; }
  .card-title { font-size: 1.2rem; font-weight: 700; margin: 8px 0; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .card-loc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { padding: 12px; border-radius: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; cursor: pointer; border: none; text-decoration: none; transition: 0.2s; }
  .btn-call { background: var(--gold); color: #000; }
  .btn-wa { background: var(--whatsapp); color: #fff; }
  .btn:active { transform: scale(0.96); }

  /* Admin Tools */
  .admin-panel { position: absolute; left: 10px; top: 50px; display: flex; flex-direction: column; gap: 5px; z-index: 20; }
  .admin-btn { background: rgba(0,0,0,0.85); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 10px; font-size: 0.7rem; cursor: pointer; backdrop-filter: blur(5px); }

  /* Lightbox & Modals */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
  #lbImg { max-width: 95%; max-height: 85vh; border-radius: 10px; }
  .lb-close { position: absolute; top: 30px; right: 30px; color: #fff; font-size: 3rem; cursor: pointer; }

  .fab { position: fixed; bottom: 30px; left: 25px; width: 65px; height: 65px; border-radius: 20px; background: var(--gold); color: #000; font-size: 35px; display: none; align-items: center; justify-content: center; z-index: 500; border: none; box-shadow: 0 10px 25px rgba(201,168,76,0.4); cursor: pointer; }
  
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(8px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--dark2); border-radius: 25px; width: 100%; max-width: 480px; padding: 25px; border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto; }
  .form-control { width: 100%; background: var(--dark3); border: 1px solid #333; border-radius: 12px; padding: 12px; color: var(--text); margin-bottom: 12px; font-family: 'Cairo'; outline: none; }
  .form-control:focus { border-color: var(--gold); }
</style>
</head>
<body id="body">

<header>
  <div class="logo" id="mainLogo">
    <div class="logo-icon">🏠</div>
    <div>سمسرني <span style="font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: -5px;">عقارات بلدنا</span></div>
  </div>
  <button onclick="document.getElementById('body').classList.toggle('light-mode')" style="background:var(--dark3); border:1.5px solid var(--gold); color:var(--gold); padding:6px 12px; border-radius:12px; cursor:pointer;">🌓</button>
</header>

<section class="hero">
  <h1>عقارك بلمسة<br><span class="highlight">سمسرني</span></h1>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث بالمنطقة، السعر، أو الوصف..." oninput="applyFilters()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('all', this)">الكل</button>
    <button class="pill" onclick="setFilter('بيع', this)">للبيع</button>
    <button class="pill" onclick="setFilter('إيجار', this)">للإيجار</button>
    <button class="pill" onclick="setFilter('شقة', this)">شقق</button>
    <button class="pill" onclick="setFilter('محل', this)">محلات</button>
  </div>
</section>

<div class="grid" id="grid"></div>

<div id="lightbox"><span class="lb-close" onclick="closeLB()">×</span><img id="lbImg"></div>

<button class="fab" id="adminBtn" onclick="document.getElementById('addModal').classList.add('open')">+</button>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 style="text-align:center; color:var(--gold); margin-bottom:20px;">إضافة إعلان جديد</h2>
    <div style="background:var(--dark3); padding:10px; border-radius:12px; margin-bottom:15px; border:1px solid var(--gold)">
      <input type="checkbox" id="f_verify"> <label for="f_verify" style="color:var(--gold); font-weight:bold; cursor:pointer;">توثيق العقار (Verified ✅)</label>
    </div>
    <div id="uBox" style="border:2px dashed var(--gold); border-radius:15px; padding:30px; text-align:center; cursor:pointer; margin-bottom:15px; background:var(--dark3)" onclick="document.getElementById('fInp').click()">
      <p id="upStatus" style="font-weight:bold;">📸 ارفع الصور و الفيديوهات</p>
      <input type="file" id="fInp" hidden multiple accept="image/*,video/*" onchange="processMedia(this)">
    </div>
    <input type="text" id="f_t" class="form-control" placeholder="عنوان الإعلان (مثلاً: شقة لقطة بالشارع الرئيسي)">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <select id="f_p" class="form-control"><option value="بيع">بيع</option><option value="إيجار">إيجار</option></select>
        <select id="f_ty" class="form-control"><option value="شقة">شقة</option><option value="محل">محل</option><option value="أرض">أرض</option></select>
    </div>
    <input type="number" id="f_pr" class="form-control" placeholder="السعر (ج.م)">
    <input type="text" id="f_a" class="form-control" placeholder="المنطقة أو العنوان">
    <input type="tel" id="f_ph" class="form-control" placeholder="رقم موبايل التواصل">
    <button class="btn btn-call" style="width:100%; margin-top:10px;" onclick="save()">🚀 انشر الإعلان الآن</button>
    <button onclick="document.getElementById('addModal').classList.remove('open')" style="width:100%; margin-top:15px; color:gray; background:none; border:none; cursor:pointer;">إلغاء</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let mediaArray = [], allData = {}, currentFilter = 'all';

  // معالجة وضغط الصور والفيديو لسرعة الموقع
  async function processMedia(input) {
    const files = Array.from(input.files);
    const status = document.getElementById('upStatus');
    status.innerHTML = "⏳ جاري الضغط (360p)...";
    mediaArray = [];

    for (let file of files) {
      if (file.type.startsWith('image')) {
        const url = await resizeImg(file);
        mediaArray.push({type:'image', src: url});
      } else {
        const url = await readFile(file);
        mediaArray.push({type:'video', src: url});
      }
    }
    status.innerHTML = "✅ جاهز للنشر (مضغوط)";
  }

  function resizeImg(file) {
    return new Promise(res => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = 800 / img.width;
          canvas.width = 800; canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          res(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function readFile(file) {
    return new Promise(res => {
      const reader = new FileReader();
      reader.onload = (e) => res(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  function save() {
    const k = localStorage.getItem('samsarny_key') || prompt("أدخل كلمة مرور الأدمن:");
    const data = {
      title: document.getElementById('f_t').value, price: document.getElementById('f_pr').value,
      purpose: document.getElementById('f_p').value, type: document.getElementById('f_ty').value,
      area: document.getElementById('f_a').value, phone: document.getElementById('f_ph').value,
      media: mediaArray, isVerified: document.getElementById('f_verify').checked,
      status: "available", date: Date.now()
    };
    if(!data.title || !data.phone) return alert("من فضلك أكمل البيانات الأساسية");
    db.ref('properties').push(data).then(() => location.reload());
  }

  db.ref('properties').on('value', snap => {
    allData = snap.val() || {};
    applyFilters();
  });

  function applyFilters() {
    const grid = document.getElementById('grid'); grid.innerHTML = "";
    const search = document.getElementById('searchInput').value.toLowerCase();
    const isAdmin = localStorage.getItem('samsarny_admin') === 'true';
    if(isAdmin) document.getElementById('adminBtn').style.display = 'flex';

    Object.keys(allData).reverse().forEach(id => {
      const item = allData[id];
      const matchSearch = item.title.toLowerCase().includes(search) || item.area.toLowerCase().includes(search);
      const matchFilter = currentFilter === 'all' || item.purpose === currentFilter || item.type === currentFilter;

      if (matchSearch && matchFilter) {
        const media = item.media || [];
        const sTxt = item.status === 'reserved' ? 'محجوز' : (item.status === 'sold' ? 'مباع' : 'متاح');
        const sCls = item.status === 'reserved' ? 'status-reserved' : (item.status === 'sold' ? 'status-sold' : 'status-available');

        grid.innerHTML += `
          <div class="card">
            <div class="image-wrapper">
              <div class="img-counter" id="count-${id}">1 / ${media.length}</div>
              <div class="image-slider" id="slider-${id}" onscroll="updateSlider('${id}', ${media.length})">
                ${media.map(m => m.type === 'video' ? 
                  `<video src="${m.src}" class="slider-item" playsinline loop muted onclick="this.paused?this.play():this.pause()"></video>` : 
                  `<img src="${m.src}" class="slider-item" onclick="openLB('${m.src}')">`).join('')}
              </div>
              ${media.length > 1 ? `
                <button class="slide-arrow arrow-left" onclick="moveSlide('${id}', 1)">❮</button>
                <button class="slide-arrow arrow-right" onclick="moveSlide('${id}', -1)">❯</button>
              ` : ''}
              <div class="status-badge ${sCls}">${sTxt}</div>
            </div>
            <div class="card-body">
              ${item.isVerified ? `<div class="verify-badge"><span>✅</span> عقار موثق من سمسرني</div>` : ''}
              <div class="price">${Number(item.price).toLocaleString()} ج.م</div>
              <h3 class="card-title">${item.title}</h3>
              <div class="card-loc">📍 ${item.area} | ${item.type}</div>
              <div class="actions">
                <a href="tel:${item.phone}" class="btn btn-call">📞 اتصال</a>
                <a href="https://wa.me/20${item.phone}" target="_blank" class="btn btn-wa">واتساب</a>
              </div>
              ${isAdmin ? `
                <div class="admin-panel">
                  <button class="admin-btn" onclick="updateStatus('${id}', 'available')">متاح</button>
                  <button class="admin-btn" onclick="updateStatus('${id}', 'reserved')">محجوز</button>
                  <button class="admin-btn" onclick="updateStatus('${id}', 'sold')">مباع</button>
                  <button class="admin-btn" style="background:red" onclick="if(confirm('حذف نهائي؟')) db.ref('properties/${id}').remove()">حذف</button>
                </div>` : ''}
            </div>
          </div>`;
      }
    });
  }

  function updateSlider(id, total) {
    const s = document.getElementById(`slider-${id}`);
    const idx = Math.round(s.scrollLeft / s.clientWidth);
    document.getElementById(`count-${id}`).innerText = `${idx + 1} / ${total}`;
  }
  function moveSlide(id, dir) {
    const s = document.getElementById(`slider-${id}`);
    s.scrollBy({ left: dir * s.clientWidth, behavior: 'smooth' });
  }
  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }
  function openLB(src) { document.getElementById('lbImg').src = src; document.getElementById('lightbox').style.display = 'flex'; }
  function closeLB() { document.getElementById('lightbox').style.display = 'none'; }
  function updateStatus(id, stat) { db.ref(`properties/${id}`).update({status: stat}); }

  document.getElementById('mainLogo').onclick = async () => {
    const p = prompt("كلمة سر الإدارة:");
    const s = await db.ref('admin_pass').get();
    if(p === String(s.val())) {
      localStorage.setItem('samsarny_admin','true');
      localStorage.setItem('samsarny_key',p);
      location.reload();
    }
  };
</script>
</body>
                                                                        </html>
