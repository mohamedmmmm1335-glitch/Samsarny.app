<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمسرني – النسخة الشاملة V25</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --dark: #0f0f0f; --dark2: #1a1a1a;
    --dark3: #242424; --card: #1e1e1e; --text: #f0ece0; --text-muted: #9a9080;
    --radius: 16px; --whatsapp: #25D366; --req-color: #3498db; --verify: #00b894;
  }
  body.light-mode { --dark: #f5f5f5; --dark2: #ffffff; --dark3: #eeeeee; --card: #ffffff; --text: #1a1a1a; --text-muted: #666666; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: 0.3s; }
  
  header { position: sticky; top: 0; z-index: 100; background: var(--dark2); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--gold); cursor: pointer; text-decoration: none; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.2rem; }

  .hero { padding: 30px 20px; text-align: center; }
  .highlight { background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
  
  .search-bar { display: flex; gap: 10px; max-width: 600px; margin: 0 auto 20px; background: var(--dark3); border: 1.5px solid rgba(201,168,76,0.25); border-radius: 16px; padding: 12px 20px; }
  .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Cairo'; font-size: 1rem; }
  
  .filter-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; padding: 0 10px; }
  .pill { padding: 6px 14px; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.2); background: var(--dark2); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
  .pill.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 4px 12px rgba(201,168,76,0.3); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 0 20px 100px; }
  .card { position: relative; background: var(--card); border-radius: var(--radius); border: 1px solid rgba(201,168,76,0.1); overflow: hidden; }
  .card.is-request { border: 2px solid var(--req-color); }
  
  .image-wrapper { position: relative; width: 100%; height: 220px; overflow: hidden; background: #000; }
  .image-slider { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .image-slider::-webkit-scrollbar { display: none; }
  .slider-item { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  
  .img-counter { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; z-index: 5; }
  .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.2rem; }
  .arrow-left { left: 8px; } .arrow-right { right: 8px; }

  .status-badge { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.75rem; z-index: 15; }
  .status-available { background: var(--gold); color: #000; }
  .status-request { background: var(--req-color); color: white; }

  .card-body { padding: 18px; }
  .price { font-weight: 900; font-size: 1.5rem; color: var(--gold); font-family: 'Tajawal'; }
  .card-title { font-size: 1.15rem; font-weight: 700; margin: 8px 0; }
  .card-info { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { padding: 12px; border-radius: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.9rem; cursor: pointer; border: none; text-decoration: none; }
  .btn-call { background: var(--gold); color: #000; }
  .btn-wa { background: var(--whatsapp); color: white; }

  .fab { position: fixed; bottom: 30px; left: 20px; width: 60px; height: 60px; border-radius: 18px; background: var(--gold); color: #000; font-size: 35px; display: none; align-items: center; justify-content: center; z-index: 500; border: none; box-shadow: 0 8px 20px rgba(201,168,76,0.3); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--dark2); border-radius: 20px; width: 100%; max-width: 450px; padding: 25px; border: 1.5px solid var(--gold); max-height: 90vh; overflow-y: auto; }
  .form-control { width: 100%; background: var(--dark3); border: 1.5px solid #333; border-radius: 12px; padding: 12px; color: var(--text); margin-bottom: 15px; font-family: 'Cairo'; outline: none; }
</style>
</head>
<body id="body">

<header>
  <div class="logo" id="mainLogo">
    <div class="logo-icon">🏠</div>
    <div>سمسرني <span style="font-size: 0.6rem; color: var(--text-muted); display: block;">عقارات بلدنا</span></div>
  </div>
  <button style="background:var(--dark3); border:1px solid var(--gold); color:var(--gold); padding:5px 10px; border-radius:10px; cursor:pointer;" onclick="document.getElementById('body').classList.toggle('light-mode')">🌓</button>
</header>

<section class="hero">
  <h1>عقارك بلمسة<br><span class="highlight">سمسرني</span></h1>
  <div class="search-bar">
    <input type="text" placeholder="ابحث بالمنطقة أو السعر..." id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('all', 'all', this)">الكل</button>
    <button class="pill" onclick="setFilter('mode', 'request', this)">المطلوب 🔍</button>
    <button class="pill" onclick="setFilter('type', 'شقة', this)">شقق</button>
    <button class="pill" onclick="setFilter('type', 'محل', this)">محلات</button>
    <button class="pill" onclick="setFilter('type', 'أرض', this)">أراضي</button>
    <button class="pill" onclick="setFilter('type', 'عمارة', this)">عمارات</button>
  </div>
</section>

<div class="grid" id="grid"></div>

<button class="fab" id="adminBtn" onclick="document.getElementById('addModal').classList.add('open')">+</button>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 style="text-align:center; color:var(--gold); margin-bottom:20px;">إضافة إعلان</h2>
    <select id="f_mode" class="form-control" onchange="document.getElementById('uBox').style.display=(this.value=='request'?'none':'block')">
      <option value="offer">معروض</option>
      <option value="request">مطلوب</option>
    </select>
    <div style="margin-bottom:15px; font-weight:bold; color:var(--gold)">
      <input type="checkbox" id="f_verify"> توثيق (Verified ✅)
    </div>
    <div id="uBox" style="background:var(--dark3); border:2px dashed var(--gold); border-radius:12px; padding:20px; text-align:center; margin-bottom:15px; cursor:pointer;" onclick="document.getElementById('fInp').click()">
      <p id="upStatus">📸 ارفع الصور و الفيديوهات</p>
      <input type="file" id="fInp" hidden multiple accept="image/*,video/*" onchange="processMedia(this)">
    </div>
    <input type="text" id="f_t" class="form-control" placeholder="عنوان الإعلان">
    <select id="f_ty" class="form-control">
      <option value="شقة">شقة</option>
      <option value="محل">محل</option>
      <option value="أرض">أرض</option>
      <option value="عمارة">عمارة</option>
    </select>
    <input type="number" id="f_pr" class="form-control" placeholder="السعر">
    <input type="text" id="f_a" class="form-control" placeholder="المنطقة">
    <input type="tel" id="f_ph" class="form-control" placeholder="رقم الموبايل">
    <button class="btn btn-call" style="width: 100%;" onclick="save()">🚀 انشر الآن</button>
    <button onclick="document.getElementById('addModal').classList.remove('open')" style="width:100%; background:none; border:none; color:gray; margin-top:15px;">إلغاء</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = { databaseURL: "https://samsarny-5a5c2-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allData = {}, currentFilters = {mode:'all', type:'all'}, mediaArray = [];

  // ماكينة الضغط (360p)
  async function processMedia(input) {
    const files = Array.from(input.files);
    document.getElementById('upStatus').innerText = "⏳ جاري المعالجة...";
    mediaArray = [];
    for (let file of files) {
      if (file.type.startsWith('image')) {
        const url = await resizeImg(file);
        mediaArray.push({type:'image', src: url});
      } else {
        const url = await readFile(file);
        mediaArray.push({type:'video', src: url});
      }
    }
    document.getElementById('upStatus').innerText = "✅ جاهز (" + files.length + ")";
  }

  function resizeImg(file) {
    return new Promise(res => {
      const r = new FileReader();
      r.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = 700 / img.width;
          canvas.width = 700; canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          res(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });
  }

  function readFile(file) { return new Promise(res => { const r = new FileReader(); r.onload = (e) => res(e.target.result); r.readAsDataURL(file); }); }

  function save() {
    const data = {
      mode: document.getElementById('f_mode').value, title: document.getElementById('f_t').value,
      type: document.getElementById('f_ty').value, price: document.getElementById('f_pr').value,
      area: document.getElementById('f_a').value, phone: document.getElementById('f_ph').value,
      media: mediaArray, isVerified: document.getElementById('f_verify').checked, date: Date.now()
    };
    db.ref('properties').push(data).then(() => location.reload());
  }

  db.ref('properties').on('value', snap => { allData = snap.val() || {}; applyFilters(); });

  function setFilter(key, val, btn) {
    currentFilters = {mode:'all', type:'all'};
    currentFilters[key] = val;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('grid'); grid.innerHTML = "";
    const isAdmin = localStorage.getItem('samsarny_admin') === 'true';
    if(isAdmin) document.getElementById('adminBtn').style.display = 'flex';

    Object.keys(allData).reverse().forEach(id => {
      const item = allData[id];
      const matchSearch = item.title.toLowerCase().includes(search) || item.area.toLowerCase().includes(search);
      const matchMode = currentFilters.mode === 'all' || item.mode === currentFilters.mode;
      const matchType = currentFilters.type === 'all' || item.type === currentFilters.type;

      if (matchSearch && matchMode && matchType) {
        const isR = item.mode === 'request';
        const media = item.media || [];
        grid.innerHTML += `
          <div class="card ${isR ? 'is-request' : ''}">
            ${!isR && media.length > 0 ? `
            <div class="image-wrapper">
              <div class="img-counter" id="c-${id}">1 / ${media.length}</div>
              <div class="image-slider" id="s-${id}" onscroll="upd('${id}', ${media.length})">
                ${media.map(m => m.type === 'video' ? 
                  `<video src="${m.src}" class="slider-item" playsinline loop muted onclick="this.paused?this.play():this.pause()"></video>` : 
                  `<img src="${m.src}" class="slider-item">`).join('')}
              </div>
              ${media.length > 1 ? `
                <button class="slide-arrow arrow-left" onclick="mv('${id}', 1)">❮</button>
                <button class="slide-arrow arrow-right" onclick="mv('${id}', -1)">❯</button>
              ` : ''}
            </div>` : ''}
            <div class="status-badge ${isR?'status-request':'status-available'}">${isR?'مطلوب 🔍':'متاح'}</div>
            <div class="card-body">
              ${item.isVerified ? `<div style="color:var(--verify); font-size:11px; font-weight:bold;">✅ موثق</div>` : ''}
              <div class="price">${Number(item.price).toLocaleString()} ج.م</div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-info">📍 ${item.area} | ${item.type}</p>
              <div class="actions">
                <a href="tel:${item.phone}" class="btn btn-call">📞 اتصال</a>
                <a href="https://wa.me/20${item.phone}" target="_blank" class="btn btn-wa">واتساب</a>
              </div>
              ${isAdmin ? `<button onclick="db.ref('properties/${id}').remove()" style="color:red; margin-top:10px; background:none; border:none; cursor:pointer;">❌ حذف</button>` : ''}
            </div>
          </div>`;
      }
    });
  }

  function upd(id, t) { const s = document.getElementById(`s-${id}`); const idx = Math.round(s.scrollLeft / s.clientWidth); document.getElementById(`c-${id}`).innerText = `${idx + 1} / ${t}`; }
  function mv(id, d) { const s = document.getElementById(`s-${id}`); s.scrollBy({ left: d * s.clientWidth, behavior: 'smooth' }); }

  document.getElementById('mainLogo').onclick = async () => {
    const p = prompt("Password:");
    const s = await db.ref('admin_pass').get();
    if(p === String(s.val())) { localStorage.setItem('samsarny_admin','true'); localStorage.setItem('samsarny_key',p); location.reload(); }
  };
</script>
</body>
</html>
