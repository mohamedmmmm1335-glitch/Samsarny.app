<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سمسرني V36</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: rgba(201,168,76,0.15);
  --dark: #0d0d0d;
  --dark2: #161616;
  --dark3: #202020;
  --card: #181818;
  --text: #f0ece0;
  --muted: #7a7060;
  --green: #25D366;
  --red: #e04040;
  --orange: #e67e22;
  --radius: 18px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.light {
  --dark: #f0ede6;
  --dark2: #ffffff;
  --dark3: #e8e4da;
  --card: #ffffff;
  --text: #1a1611;
  --muted: #8a8070;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;direction:rtl;}

/* ====== HEADER ====== */
header{
  position:sticky;top:0;z-index:900;
  background:rgba(13,13,13,0.96);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(201,168,76,0.18);
  padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
body.light header{background:rgba(255,255,255,0.96);}

.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.logo-icon{
  width:42px;height:42px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;color:#000;font-weight:900;flex-shrink:0;
}
.logo-text{font-family:'Tajawal',sans-serif;font-weight:900;font-size:1.35rem;color:var(--gold);line-height:1;}
.logo-sub{font-size:0.62rem;color:var(--muted);font-weight:400;font-family:'Cairo',sans-serif;}

.header-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:40px;height:40px;border-radius:10px;border:1.5px solid rgba(201,168,76,0.2);
  background:transparent;color:var(--text);font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.icon-btn:hover{border-color:var(--gold);background:var(--gold-dim);}
.admin-badge{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#000;padding:6px 14px;border-radius:10px;font-size:0.78rem;
  font-weight:800;border:none;cursor:pointer;
}

/* ====== HERO ====== */
.hero{padding:28px 20px 10px;text-align:center;}
.hero h1{
  font-family:'Tajawal',sans-serif;font-size:clamp(1.6rem,4.5vw,2.8rem);
  font-weight:900;line-height:1.3;margin-bottom:8px;
}
.highlight{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-sub{color:var(--muted);font-size:0.92rem;margin-bottom:20px;}

/* Stats */
.stats-row{display:flex;justify-content:center;gap:28px;margin-bottom:22px;flex-wrap:wrap;}
.stat-item{text-align:center;}
.stat-n{font-family:'Tajawal',sans-serif;font-size:1.7rem;font-weight:900;color:var(--gold);}
.stat-l{font-size:0.72rem;color:var(--muted);}

/* Search */
.search-wrap{max-width:600px;margin:0 auto 16px;}
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--dark3);border:1.5px solid rgba(201,168,76,0.25);
  border-radius:14px;padding:12px 18px;transition:border-color 0.2s;
}
.search-bar:focus-within{border-color:var(--gold);}
.search-bar input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:'Cairo';font-size:0.95rem;
}
.search-bar input::placeholder{color:var(--muted);}

/* Filter pills */
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px 20px;}
.pill{
  padding:8px 18px;border-radius:50px;
  border:1.5px solid rgba(201,168,76,0.2);
  background:transparent;color:var(--muted);
  font-family:'Cairo';font-size:0.84rem;font-weight:700;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.pill:hover{border-color:var(--gold);color:var(--gold);}
.pill.active{background:var(--gold);color:#000;border-color:var(--gold);}

/* ====== GRID ====== */
.section-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px 14px;
}
.section-label h2{font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:800;}
.section-label h2 span{color:var(--gold);}
.sort-select{
  background:var(--dark3);border:1px solid rgba(201,168,76,0.2);
  border-radius:8px;padding:6px 12px;color:var(--text);
  font-family:'Cairo';font-size:0.8rem;cursor:pointer;outline:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;padding:0 18px;
  padding-bottom:calc(90px + var(--safe-bottom));
}

/* ====== CARD ====== */
.card{
  background:var(--card);border-radius:var(--radius);
  border:1px solid rgba(255,255,255,0.05);
  overflow:hidden;position:relative;
  transition:transform 0.25s,box-shadow 0.25s;
  animation:fadeUp 0.35s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 50px rgba(0,0,0,0.5),0 0 0 1px rgba(201,168,76,0.12);}

/* Card image */
.card-imgs{position:relative;height:220px;background:#111;overflow:hidden;}
.img-slider{
  display:flex;width:100%;height:100%;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
}
.img-slider::-webkit-scrollbar{display:none;}
.img-slide{
  flex:0 0 100%;height:100%;scroll-snap-align:start;
  object-fit:cover;cursor:zoom-in;transition:transform 0.3s;
}
.img-slide:hover{transform:scale(1.03);}
.no-img{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(135deg,#111,#1a1a1a);
  color:var(--muted);font-size:2.8rem;
}
.no-img span{font-size:0.75rem;margin-top:8px;font-family:'Cairo';}

/* Image dots */
.img-dots{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;z-index:10;
}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);transition:all 0.2s;}
.dot.on{background:#fff;width:16px;border-radius:3px;}

/* Counter */
.img-counter{
  position:absolute;bottom:10px;right:12px;
  background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);
  color:#fff;padding:3px 10px;border-radius:20px;font-size:0.72rem;z-index:10;
}

/* Badges */
.purpose-badge{
  position:absolute;top:12px;right:12px;
  padding:5px 12px;border-radius:8px;font-weight:800;font-size:0.78rem;z-index:10;
}
.b-rent{background:rgba(76,175,125,0.9);color:#fff;}
.b-sale{background:rgba(201,168,76,0.92);color:#000;}
.b-worker{background:rgba(100,149,237,0.9);color:#fff;}
.b-req{background:rgba(150,100,200,0.9);color:#fff;}

.status-ribbon{
  position:absolute;top:12px;left:12px;
  padding:4px 10px;border-radius:7px;font-size:0.72rem;font-weight:800;z-index:10;
}
.r-available{display:none;}
.r-reserved{background:var(--orange);color:#fff;}
.r-sold{background:var(--red);color:#fff;}

.verify-badge{
  position:absolute;bottom:10px;left:10px;
  background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);
  color:var(--gold);font-size:0.72rem;padding:3px 10px;border-radius:20px;z-index:10;
}

/* Admin overlay */
.admin-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.5);
  display:none;align-items:center;justify-content:center;gap:10px;z-index:50;
  opacity:0;transition:opacity 0.2s;
}
.card:hover .admin-overlay.visible{opacity:1;}
.admin-overlay.visible{display:flex;}
.ov-btn{
  padding:9px 18px;border-radius:10px;border:none;
  font-family:'Cairo';font-size:0.85rem;font-weight:800;cursor:pointer;
  transition:transform 0.15s;
}
.ov-btn:hover{transform:scale(1.05);}
.ov-edit{background:var(--gold);color:#000;}
.ov-del{background:var(--red);color:#fff;}
.ov-status{background:var(--dark2);color:var(--text);border:1px solid var(--gold);}

/* Card body */
.card-body{padding:16px;}
.card-price{
  font-family:'Tajawal',sans-serif;font-size:1.5rem;font-weight:900;
  color:var(--gold);margin-bottom:4px;
}
.card-price small{font-size:0.7rem;color:var(--muted);font-weight:400;}
.card-title{font-size:0.97rem;font-weight:700;margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;gap:12px;color:var(--muted);font-size:0.8rem;margin-bottom:12px;flex-wrap:wrap;}
.card-meta span{display:flex;align-items:center;gap:4px;}

.card-actions{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;}
.act-btn{
  padding:11px;border-radius:12px;
  font-family:'Cairo';font-weight:800;font-size:0.85rem;
  display:flex;align-items:center;justify-content:center;gap:7px;
  text-decoration:none;border:none;cursor:pointer;transition:all 0.2s;
}
.act-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
.btn-call{background:var(--gold);color:#000;}
.btn-wa{background:var(--green);color:#fff;}
.btn-share{background:var(--dark3);color:var(--text);border:1px solid rgba(255,255,255,0.1);}

/* Ad banner */
.ad-card{
  background:linear-gradient(135deg,rgba(201,168,76,0.08),rgba(201,168,76,0.03));
  border:1.5px dashed rgba(201,168,76,0.3);
  border-radius:var(--radius);padding:24px;text-align:center;
  color:var(--gold);font-weight:700;font-size:0.9rem;
}
.ad-card small{display:block;color:var(--muted);margin-top:4px;font-size:0.78rem;font-weight:400;}

/* ====== LIGHTBOX ====== */
#lb{
  position:fixed;inset:0;background:#000;z-index:8000;
  display:none;flex-direction:column;
}
#lb.open{display:flex;}
.lb-top{
  padding:16px 20px;display:flex;justify-content:space-between;align-items:center;
  background:rgba(0,0,0,0.5);
}
.lb-title{color:#fff;font-size:0.9rem;font-weight:700;}
.lb-controls{display:flex;gap:10px;align-items:center;}
.lb-ctrl{
  background:rgba(255,255,255,0.1);border:none;color:#fff;
  width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.lb-close{font-size:1.6rem;cursor:pointer;color:#fff;padding:4px 8px;}
.lb-body{flex:1;display:flex;overflow:hidden;position:relative;}
.lb-scroller{
  display:flex;width:100%;height:100%;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
}
.lb-scroller::-webkit-scrollbar{display:none;}
.lb-slide-wrap{
  min-width:100%;height:100%;scroll-snap-align:start;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.lb-img{
  max-width:100%;max-height:100%;
  object-fit:contain;transition:transform 0.25s;
  transform-origin:center;cursor:grab;
}
.lb-img:active{cursor:grabbing;}
.lb-counter{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.6);color:#fff;
  padding:5px 16px;border-radius:20px;font-size:0.82rem;
}

/* ====== FAB ====== */
.fab{
  position:fixed;bottom:calc(24px + var(--safe-bottom));left:22px;
  width:58px;height:58px;border-radius:18px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#000;font-size:1.7rem;border:none;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(201,168,76,0.4);
  transition:all 0.2s;z-index:700;
}
.fab:hover{transform:rotate(45deg) scale(1.1);}

/* ====== MODAL ====== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.88);
  backdrop-filter:blur(6px);z-index:5000;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--dark2);width:100%;max-width:480px;
  border-radius:22px;border:1px solid rgba(201,168,76,0.25);
  padding:24px 22px;max-height:90vh;overflow-y:auto;
  animation:slideUp 0.28s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{
  font-family:'Tajawal',sans-serif;font-weight:900;font-size:1.25rem;
  color:var(--gold);margin-bottom:20px;text-align:center;
}
.modal-close-row{display:flex;justify-content:flex-start;margin-bottom:6px;}
.modal-close-btn{
  background:rgba(255,255,255,0.07);border:none;
  color:var(--muted);width:34px;height:34px;
  border-radius:9px;font-size:1.1rem;cursor:pointer;
}

/* Form */
.field-group{margin-bottom:14px;}
.field-label{font-size:0.8rem;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;}
.finput{
  width:100%;background:var(--dark3);border:1.5px solid rgba(255,255,255,0.08);
  border-radius:11px;padding:12px 14px;color:var(--text);
  font-family:'Cairo';font-size:0.92rem;outline:none;transition:border-color 0.2s;
}
.finput:focus{border-color:var(--gold);}
select.finput{cursor:pointer;}
select.finput option{background:var(--dark2);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Media upload */
.upload-zone{
  border:2px dashed rgba(201,168,76,0.3);border-radius:13px;
  padding:22px;text-align:center;cursor:pointer;
  background:var(--dark3);transition:all 0.2s;position:relative;overflow:hidden;
}
.upload-zone:hover{border-color:var(--gold);background:rgba(201,168,76,0.05);}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-icon{font-size:1.8rem;margin-bottom:6px;}
.upload-hint{font-size:0.78rem;color:var(--muted);}
.upload-hint span{color:var(--gold);}

.prev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.prev-item{position:relative;height:80px;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);}
.prev-item img{width:100%;height:100%;object-fit:cover;}
.prev-del{
  position:absolute;top:4px;right:4px;
  background:rgba(0,0,0,0.75);color:#fff;border:none;
  width:22px;height:22px;border-radius:50%;font-size:0.8rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.toggle{position:relative;width:46px;height:25px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{
  position:absolute;inset:0;background:var(--dark3);
  border-radius:25px;cursor:pointer;transition:0.3s;border:1.5px solid rgba(255,255,255,0.1);
}
.toggle-slider::before{
  content:'';position:absolute;width:17px;height:17px;
  background:#fff;border-radius:50%;bottom:3px;right:3px;transition:0.3s;
}
.toggle input:checked + .toggle-slider{background:var(--gold);}
.toggle input:checked + .toggle-slider::before{transform:translateX(-21px);}
.toggle-label{font-size:0.87rem;color:var(--muted);font-weight:600;}

/* Submit */
.submit-btn{
  width:100%;padding:14px;border-radius:13px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#000;font-family:'Cairo';font-weight:900;font-size:1rem;
  border:none;cursor:pointer;transition:all 0.2s;margin-top:4px;
}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,168,76,0.35);}
.cancel-btn{
  width:100%;padding:11px;border-radius:13px;background:none;
  border:1.5px solid rgba(255,255,255,0.1);color:var(--muted);
  font-family:'Cairo';font-weight:700;cursor:pointer;margin-top:10px;
}

/* Admin login */
.login-modal{max-width:340px;text-align:center;}
.login-modal .finput{text-align:center;font-size:1.1rem;letter-spacing:4px;}

/* ====== TOAST ====== */
.toast{
  position:fixed;bottom:calc(30px + var(--safe-bottom));left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--dark2);border:1px solid rgba(201,168,76,0.3);
  color:var(--text);padding:12px 22px;border-radius:13px;
  font-size:0.88rem;font-weight:700;z-index:9999;
  transition:transform 0.3s ease;pointer-events:none;
  display:flex;align-items:center;gap:9px;
  box-shadow:0 12px 40px rgba(0,0,0,0.5);
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ====== EMPTY ====== */
.empty{
  grid-column:1/-1;text-align:center;padding:70px 20px;
}
.empty-icon{font-size:4rem;margin-bottom:14px;}
.empty h3{font-size:1.15rem;margin-bottom:8px;}
.empty p{color:var(--muted);font-size:0.88rem;}

/* ====== RESPONSIVE ====== */
@media(max-width:480px){
  .field-row{grid-template-columns:1fr;}
  .stats-row{gap:18px;}
  .card-actions{grid-template-columns:1fr 1fr 42px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo" onclick="tryLogin()">
    <div class="logo-icon">🏠</div>
    <div>
      <div class="logo-text">سمسرني</div>
      <div class="logo-sub">عقاراتك وصنايعيتك</div>
    </div>
  </div>
  <div class="header-right">
    <span id="adminBadge" style="display:none">
      <button class="admin-badge" onclick="openForm()">+ إضافة</button>
    </span>
    <button class="icon-btn" onclick="document.body.classList.toggle('light')" title="تغيير الثيم">🌓</button>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>بيت جديد.. أو <span class="highlight">صنايعي شاطر</span></h1>
  <p class="hero-sub">أفضل العقارات والخدمات في بلدنا</p>

  <div class="stats-row" id="statsRow">
    <div class="stat-item"><div class="stat-n" id="s-total">0</div><div class="stat-l">إعلان</div></div>
    <div class="stat-item"><div class="stat-n" id="s-rent">0</div><div class="stat-l">للإيجار</div></div>
    <div class="stat-item"><div class="stat-n" id="s-sale">0</div><div class="stat-l">للبيع</div></div>
    <div class="stat-item"><div class="stat-n" id="s-worker">0</div><div class="stat-l">صنايعي</div></div>
  </div>

  <div class="search-wrap">
    <div class="search-bar">
      <span style="color:var(--muted)">🔍</span>
      <input type="text" id="searchBox" placeholder="ابحث عن منطقة، شقة، نجار..." oninput="renderAll()">
    </div>
  </div>

  <div class="pills">
    <button class="pill active" onclick="setFilter('all','all',this)">الكل</button>
    <button class="pill" onclick="setFilter('purpose','إيجار',this)">للإيجار</button>
    <button class="pill" onclick="setFilter('purpose','بيع',this)">للبيع</button>
    <button class="pill" onclick="setFilter('mode','worker',this)">صنايعية</button>
    <button class="pill" onclick="setFilter('mode','request',this)">مطلوب</button>
    <button class="pill" onclick="setFilter('status','available',this)">متاح فقط</button>
  </div>
</section>

<!-- GRID -->
<div class="section-label">
  <h2>الإعلانات <span id="countSpan"></span></h2>
  <select class="sort-select" onchange="renderAll();" id="sortSel">
    <option value="newest">الأحدث أولاً</option>
    <option value="price_asc">السعر ↑</option>
    <option value="price_desc">السعر ↓</option>
  </select>
</div>
<div class="grid" id="mainGrid"></div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openForm()">+</button>

<!-- ====== LIGHTBOX ====== -->
<div id="lb">
  <div class="lb-top">
    <div class="lb-title" id="lbTitle">الصور</div>
    <div class="lb-controls">
      <button class="lb-ctrl" onclick="lbZoom(1.25)">＋</button>
      <span id="lbZoomLabel" style="color:#fff;font-size:0.85rem;min-width:40px;text-align:center;">100%</span>
      <button class="lb-ctrl" onclick="lbZoom(0.8)">－</button>
      <span class="lb-close" onclick="closeLB()">✕</span>
    </div>
  </div>
  <div class="lb-body">
    <div class="lb-scroller" id="lbScroller"></div>

// ===================== RENDER =====================
function renderAll() {
  const grid = document.getElementById('mainGrid');

  const sortBy = document.getElementById('sortSel').value;

  let items = Object.keys(store).map(id => ({id, ...store[id]}));

  // Filter

      (itm.area||'').toLowerCase().includes(q) ||
      (itm.type||'').toLowerCase().includes(q)
    );
  }

  // Sort
  if(sortBy === 'newest') items.sort((a,b) => (b.time||0) - (a.time||0));
  else if(sortBy === 'price_asc') items.sort((a,b) => Number(a.price||0) - Number(b.price||0));
  else if(sortBy === 'price_desc') items.sort((a,b) => Number(b.price||0) - Number(a.price||0));

  // Stats

  let html = '';
  items.forEach((itm, idx) => {
    const media = itm.media || [];

    // Purpose badge
    let purposeClass = 'b-sale', purposeTxt = itm.purpose || 'بيع';

    else if(mode === 'request') { purposeClass = 'b-req'; purposeTxt = '🔎 مطلوب'; }
    else if(itm.purpose === 'إيجار') { purposeClass = 'b-rent'; purposeTxt = '🔑 إيجار'; }

    // Status ribbon
    let ribbonHtml = '';

    else if(status === 'sold') ribbonHtml = `<div class="status-ribbon r-sold">🔴 ${mode==='worker'?'تم التنفيذ':'تم البيع'}</div>`;

    // Images

    } else {

    }

    // Dots (max 5 dots)

    // Counter

    // Price
    const priceLabel = itm.purpose === 'إيجار' ? '/شهر' : '';

    let priceDisplay = priceNum.toLocaleString('ar-EG');
    if(priceNum >= 1000000) priceDisplay = (priceNum/1000000).toFixed(1) + ' مليون';
    else if(priceNum >= 1000) priceDisplay = (priceNum/1000).toFixed(0) + ' ألف';

    // WhatsApp: fix phone number (remove leading 0, add 20)
    const rawPhone = String(itm.phone || '').replace(/\D/g,'');

    const adminOverlay = isAdmin ? `

        </div>

          <a href="tel:${itm.phone}" class="act-btn btn-call">📞 اتصال</a>

          <button class="act-btn btn-share" onclick="shareItem('${itm.id}')" title="مشاركة">📤</button>
        </div>
      </div>

    // Ad every 5 items
    if((idx + 1) % 5 === 0) {
      html += `<div class="ad-card">📢 سمسرني – طلبك عندنا!<small>للإعلان تواصل معنا</small></div>`;
    }
  });

  grid.innerHTML = html;
}

// ===================== SLIDER =====================
function onSliderScroll(el) {
  const w = el.offsetWidth;
  const scrolled = Math.abs(el.scrollLeft);
  const curr = Math.round(scrolled / w);
  const card = el.closest('.card');

  // Update counter
  const counter = card.querySelector('.img-counter');
  const media = el.querySelectorAll('.img-slide').length;
  if(counter) counter.innerText = `${curr+1} / ${media}`;

  // Update dots
  card.querySelectorAll('.dot').forEach((d,i) => {
    d.classList.toggle('on', i === curr);
  });
}

// ===================== LIGHTBOX =====================
function openLB(id, startIdx) {
  const itm = store[id];
  if(!itm || !itm.media) return;

  lbZoomLevel = 1;
  document.getElementById('lbZoomLabel').textContent = '100%';
  document.getElementById('lbTitle').textContent = itm.title || 'الصور';

  const scroller = document.getElementById('lbScroller');
  scroller.innerHTML = itm.media.map(m =>
    `<div class="lb-slide-wrap"><img class="lb-img" src="${m.src||m.url||''}" draggable="false"></div>`
  ).join('');

  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Scroll to index
  setTimeout(() => {
    scroller.scrollLeft = startIdx * scroller.clientWidth;
    updateLBCounter(scroller);
  }, 60);

  scroller.onscroll = () => updateLBCounter(scroller);
}

function updateLBCounter(scroller) {
  const total = scroller.querySelectorAll('.lb-slide-wrap').length;
  const curr = Math.round(Math.abs(scroller.scrollLeft) / scroller.clientWidth) + 1;
  document.getElementById('lbCounter').textContent = `${curr} / ${total}`;
}

function closeLB() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}

function lbZoom(factor) {
  lbZoomLevel = Math.max(0.5, Math.min(4, lbZoomLevel * factor));
  document.getElementById('lbZoomLabel').textContent = Math.round(lbZoomLevel * 100) + '%';
  document.querySelectorAll('.lb-img').forEach(img => {
    img.style.transform = `scale(${lbZoomLevel})`;
  });
}

// ===================== MEDIA =====================
async function handleFiles(input) {
  const MAX_SIZE = 800; // px - resize to save storage
  for(const file of input.files) {
    const resized = await resizeImage(file, MAX_SIZE);
    tempMedia.push({ src: resized, uploaded: false });
  }
  input.value = '';
  drawPreview();
}

function resizeImage(file, maxPx) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if(w > maxPx || h > maxPx) {
          if(w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function drawPreview() {
  const grid = document.getElementById('prevGrid');
  grid.innerHTML = tempMedia.map((m, i) => `
    <div class="prev-item">
      <img src="${m.src || m.url}" alt="">
      <button class="prev-del" onclick="removeMedia(${i})">×</button>
    </div>`).join('');
}

function removeMedia(i) {
  tempMedia.splice(i, 1);
  drawPreview();
}

// Upload images - base64 مباشرة في DB (بدون Storage)
async function uploadMediaToStorage(id) {
  return tempMedia.map(m => ({ src: m.src || m.url || '' }));
}

function dataURLtoBlob(dataurl) {
  const arr = dataurl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

// ===================== SAVE =====================
async function saveData() {
  const title = document.getElementById('m_title').value.trim();
  const phone = document.getElementById('m_phone').value.trim();
  const area  = document.getElementById('m_area').value.trim();

  if(!title || !phone) {
    toast('⚠️', 'الرجاء كتابة العنوان ورقم الموبايل على الأقل');
    return;
  }

  const btn = document.querySelector('.submit-btn');
  btn.textContent = '⏳ جاري الرفع...';
  btn.disabled = true;

  const editId = document.getElementById('editId').value;
  const propId = editId || db.ref('properties').push().key;

  try {
    // Upload images to Storage (not base64 in DB!)
    const mediaArr = await uploadMediaToStorage(propId);

    const data = {
      mode:     document.getElementById('m_mode').value,
      title,
      purpose:  document.getElementById('m_purpose').value,
      type:     document.getElementById('m_type').value,
      price:    document.getElementById('m_price').value || 0,
      area,
      phone:    phone.replace(/\s/g,''),
      status:   document.getElementById('m_status').value,
      desc:     document.getElementById('m_desc').value.trim(),
      verified: document.getElementById('m_verify').checked,
      media:    mediaArr,
      time:     Date.now()
    };

    await db.ref('properties/' + propId).set(data);
    closeForm();
    toast('✅', editId ? 'تم تعديل الإعلان!' : 'تم نشر الإعلان!');
  } catch(err) {
    console.error(err);
    toast('❌', 'حصلت مشكلة، جرب تاني');
  }

  btn.textContent = '🚀 نشر الإعلان';
  btn.disabled = false;
}

}

async function checkPass() {
  const entered = document.getElementById('passInput').value;
  if(!entered) return;
  const snap = await db.ref('admin_pass').once('value');
  if(entered === String(snap.val())) {
    localStorage.setItem('samsar_admin', 'true');
    isAdmin = true;
    showAdminUI();
    closeLogin();
    toast('🎉', 'أهلاً يا مسؤول!');
    renderAll();
  } else {
    toast('❌', 'كلمة السر غلط!');
    document.getElementById('passInput').value = '';
  }
}

function showAdminUI() {
  document.getElementById('adminBadge').style.display = 'inline';
  document.getElementById('fab').style.display = 'flex';
}

function hideAdminUI() {
  document.getElementById('adminBadge').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
  renderAll();
}

// ===================== TOAST =====================
let toastTimer;
function toast(icon, msg) {
  document.getElementById('toastIcon').textContent = icon;
  document.getElementById('toastMsg').textContent  = msg;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// ===================== CLOSE OVERLAYS ON BG CLICK =====================
['formOverlay','loginOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if(e.target.id === id) {
      document.getElementById(id).classList.remove('open');
      document.body.style.overflow = '';
    }
  });
});
</script>
